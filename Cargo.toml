[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/gaiger777/opLite"

[workspace.dependencies]
opl-types = { path = "crates/opl-types" }
opl-qemu = { path = "crates/opl-qemu" }
opl-cluster = { path = "crates/opl-cluster" }
opl-peer = { path = "crates/opl-peer" }
opl-driver = { path = "crates/opl-driver" }
opl-reconciler = { path = "crates/opl-reconciler" }
opl-api = { path = "crates/opl-api" }
oplctl = { path = "crates/oplctl" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs", "signal"] }
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }
insta = "1.49.0"
tempfile = "3.27.0"
async-trait = "0.1.92"
fs4 = "1.1.0"
tracing = "0.1.44"
openraft = { version = "0.9.25", features = ["serde", "storage-v2"] }
redb = "4.4.0"
rustix = { version = "1.1.5", features = ["fs", "process"] }
utoipa = { version = "6.0.0", features = ["uuid"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
argon2 = "0.6.0"
sha2 = "0.11.1"
getrandom = "0.4.3"
hex = "0.4.3"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "query", "native-tls"] }
tokio-tungstenite = "0.29.0"
utoipa-axum = "0.3.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow = "1.0.104"
rpassword = "7.5.4"
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.1.8"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tonic = { version = "0.14.6", default-features = false, features = ["transport", "codegen", "router", "tls-ring"] }
tonic-build = { version = "0.14.6", default-features = false }
tokio-stream = { version = "0.1.19", features = ["net"] }
bytes = "1.12.1"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
x509-parser = "0.18.1"
time = "0.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging"] }
rustls-pki-types = "1.15.1"
native-tls = "0.2.18"
