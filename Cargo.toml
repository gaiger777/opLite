[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/gaiger777/opLite"

[workspace.dependencies]
opl-types = { path = "crates/opl-types" }
opl-qemu = { path = "crates/opl-qemu" }
opl-cluster = { path = "crates/opl-cluster" }
opl-peer = { path = "crates/opl-peer" }
opl-driver = { path = "crates/opl-driver" }
opl-reconciler = { path = "crates/opl-reconciler" }
opl-api = { path = "crates/opl-api" }
oplctl = { path = "crates/oplctl" }
opl-store = { path = "crates/opl-store" }
opl-restore = { path = "crates/opl-restore" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs", "signal"] }
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }
insta = "1.49.0"
# 성질 시험(계획 62 권한 색인). fork·timeout 없이 std만 쓴다.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"
async-trait = "0.1.92"
fs4 = "1.1.0"
tracing = "0.1.44"
openraft = { version = "0.9.25", features = ["serde", "storage-v2"] }
redb = "4.4.0"
rustix = { version = "1.1.5", features = ["fs", "process"] }
utoipa = { version = "6.0.0", features = ["uuid"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
argon2 = "0.6.0"
sha2 = "0.11.1"
sha1 = "0.11.0"
roxmltree = "0.21.2"
getrandom = "0.4.3"
hex = "0.4.3"
futures-util = "0.3.34"
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "query", "native-tls"] }
tokio-tungstenite = "0.29.0"
utoipa-axum = "0.3.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow = "1.0.104"
rpassword = "7.5.4"
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.1.8"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tonic = { version = "0.14.6", default-features = false, features = ["transport", "codegen", "router", "tls-ring"] }
tonic-build = { version = "0.14.6", default-features = false }
tokio-stream = { version = "0.1.19", features = ["net"] }
bytes = "1.12.1"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
x509-parser = "0.18.1"
time = "0.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging"] }
rustls-pki-types = "1.15.1"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
native-tls = "0.2.18"
ring = "0.17.14"
base64 = "0.22.1"
# 백업 저장소 청크 압축(계획 68). 순수 Rust, unsafe 없는 길만 쓴다.
lz4_flex = { version = "0.14.2", default-features = false, features = ["safe-encode", "safe-decode", "std"] }
# 파일 단위 복원의 zip(deflate)·tar.gz(계획 69). 기본 백엔드 miniz_oxide·crc32fast — 순수 Rust(도우미 에이전트를
# musl로 C 없이 빌드한다).
flate2 = "1.1.11"
# S3 백엔드의 시스템 루트 인증서(계획 68). lettre가 이미 끌어온다.
rustls-native-certs = "0.8.5"
# TOTP 비밀의 base32(계획 62). 이미 트리에 있다.
data-encoding = "2.11.1"
# WebAuthn(패스키) attestationObject·COSE 키의 CBOR(계획 62). Apache-2.0, 버전을 못 박는다(직접 짠 최소 검증기가 기대는 모양).
ciborium = { version = "=0.2.2", default-features = false, features = ["std"] }
rust-embed = { version = "8.13.0", features = ["mime-guess", "interpolate-folder-path"] }
libc = "0.2.191"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
lber = "0.5.1"
# 알림 메일(계획 60). 기본 기능을 끄고 SMTP·메시지 만들기와 rustls(ring, 시스템 루트 인증서)만 쓴다.
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls", "ring", "rustls-native-certs"] }

# 시험 빌드에서도 redb는 최적화한다. 최적화하지 않으면 커밋마다 페이지를 0으로 채우는 데 시간을 써서 노드를
# 수백 개 띄우는 규모 시험(opl-cluster scale-it)의 쓰기 지연을 그것이 차지한다.
[profile.dev.package.redb]
opt-level = 3
