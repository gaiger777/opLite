name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: OpenSSL headers (Linux; native-tls)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      # 시험 빌드에만 있는 고리로 리더의 api 실행기를 막는 굶김 시험(QEMU 없음)
      - run: cargo test -p opld --features starve-it --test starve
      # 지표 기록·경보 시험 고리(`[test] metrics_flush_secs`·`alert_tick_ms`)로 재시작 뒤 기록, Prometheus 긁기(엄격한
      # 파서), webhook으로 경보 발생·해제(계획 60, QEMU 없음)
      - run: cargo test -p opld --features metrics-it --test metrics_history --test alerts
      # 가짜 vSphere(계획 72, 같은 프로세스 — 시스템 도구 없음): 세션·인벤토리·CBT 회차와 게스트 쓰기·티켓 범위 읽기·결함,
      # 원본 연결·찾아보기·이전 계획·미리 확인 API
      - run: cargo test -p opl-api --features fake-vsphere --test vsphere --test vmware_api
      # 노드 100개(투표 5, 대기 learner 2, 나머지 관찰 노드)를 한 프로세스에 띄워 리더 RPC(확인 묶기 비율 포함)·쓰기
      # p99·관찰 노드 뒤처짐·노드 추가·투표 멤버와 리더 장애를 잰다(설계 §5·§6·§14·§15, 개발 Mac에서 16초쯤)
      - name: Scale test (100 nodes in one process)
        run: cargo test -p opl-cluster --features scale-it --test scale -- --nocapture
        timeout-minutes: 10
        env:
          OPL_SCALE_NODES: 100
          # 코어 3~4개 러너에서 노드 100개의 쓰기가 CPU에 묶여 흔들린다. 쓰기 p99 기준만 늦춘다(README, 설계 §14).
          OPL_SCALE_P99_MS: 200
      - name: Storage integration tests (qemu-img)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils unzip libarchive-tools
          cargo test -p opl-driver --features storage-it --test dir_storage
          cargo test -p opl-store --features storage-it --test nbd_qemu -- --nocapture
          cargo test -p opl-api --features storage-it --test volumes --test downloads
          cargo test -p opl-api --features storage-it --test backup_tasks --test backup_job_runs --test vm_import_tasks --test backup_store_tasks --test live_restore_tasks
          # 파일 복원 zip·tar.gz를 unzip·bsdtar·GNU tar·Python zipfile로 읽어 봄(계획 69)
          cargo test -p opl-restore --features storage-it --test archive_tools
      # 도우미 VM 에이전트는 정적 musl로 C 툴체인 없이 빌드한다 — C를 쓰는 의존성(cc 빌드 스크립트·ring)이 들어오면 실패(계획 69 §8.2)
      - name: Restore agent has no C dependencies
        if: runner.os == 'Linux'
        run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            if cargo tree -p opl-restore --target "$t" -e normal,build --prefix none | grep -E '^(cc|ring|openssl-sys) '; then
              echo "opl-restore pulls in a C dependency for $t"; exit 1
            fi
          done

  # 웹 UI: 타입 검사, 린트, 단위 테스트, API 타입이 Rust 정의와 같은지, 알려진 취약점, 빌드
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: OpenSSL headers (native-tls)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: API types match the Rust API
        run: |
          pnpm gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: pnpm audit --prod
      - run: pnpm build

  # 패키징 셸 스크립트: shellcheck, build-deb.sh 버전 확인·키링 시험, build-repo.sh 시험(가짜 apt-ftparchive·gpg),
  # maintainer 스크립트 시험(가짜 systemctl), 옛 제품 이름(oplite)이 허용 목록 밖에 남지 않았는지(name-test.sh)
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shopt -s globstar
          shellcheck packaging/**/*.sh packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm .github/scripts/*.sh
      - run: bash packaging/tests/name-test.sh
      - run: bash packaging/tests/build-deb-test.sh
      - run: bash packaging/tests/build-repo-test.sh
      - run: bash packaging/tests/portal-test.sh
      - run: bash packaging/tests/maint-test.sh
      - run: bash packaging/tests/setup-test.sh
      # 설치 프로그램 환경(busybox sh·awk)에서 orbivisor-setup.sh 함수가 같은 결과를 내는지
      - name: setup-test with busybox
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox
          OPL_SH="busybox sh" OPL_AWK="busybox awk" bash packaging/tests/setup-test.sh
      - run: bash packaging/tests/iso-test.sh
      # 파일 복원 도우미 이미지 빌더(계획 69): 가짜 deb으로 잠금 파일·해시·라이브러리·모듈 차례·initramfs·재현
      - name: restore-image-test
        run: |
          sudo apt-get install -y libarchive-tools zstd
          bash packaging/tests/restore-image-test.sh

  # Debian 패키지 orbivisor와 전환 패키지 oplite: 웹 UI를 넣은 릴리스 빌드 → build-deb.sh(.github/actions/build-deb) →
  # Debian 13 컨테이너에서 설치 시험, build-repo.sh로 만든 APT 저장소에서 옛 oplite를 설치하고 testing 채널의
  # orbivisor로 넘어가는 시험. 파일 복원 도우미 이미지 꾸러미 orbivisor-restore-image(계획 69)도 만들어 함께 설치해 본다.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-deb
        id: build
      # 파일 복원 도우미 이미지(계획 69): 에이전트를 정적 musl로(rust-lld) 빌드하고 debian.lock의 Debian 13 deb으로 x86_64
      # 이미지를 만든 뒤, build-deb.sh를 OPL_RESTORE_IMAGE_DIR와 다시 돌려 셋째 꾸러미 orbivisor-restore-image를 만든다.
      - name: File restore helper image
        id: image
        env:
          OPL_DEV_LICENSE: "1"
        run: |
          sudo apt-get install -y libarchive-tools zstd
          rustup target add x86_64-unknown-linux-musl
          packaging/restore-image/build.sh --arch x86_64 --version "$OPL_VERSION" --out dist/restore-image/x86_64
          OPL_RESTORE_IMAGE_DIR=dist/restore-image/x86_64 packaging/deb/build-deb.sh "$OPL_VERSION" dist
          echo "deb=dist/orbivisor-restore-image_${OPL_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
      - name: Package info and contents
        env:
          DEB: ${{ steps.build.outputs.deb }}
          TRANS_DEB: ${{ steps.build.outputs.transitional }}
          IMAGE_DEB: ${{ steps.image.outputs.deb }}
        run: |
          for deb in "$DEB" "$TRANS_DEB" "$IMAGE_DEB"; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
      - name: Install test in Debian 13
        env:
          DEB: ${{ steps.build.outputs.deb }}
          TRANS_DEB: ${{ steps.build.outputs.transitional }}
          IMAGE_DEB: ${{ steps.image.outputs.deb }}
        run: |
          docker run --rm -v "$PWD:/work" debian:13 \
            bash /work/packaging/tests/deb-test.sh "/work/$DEB" "/work/$TRANS_DEB" "/work/$IMAGE_DEB"
      - name: APT repository test in Debian 13
        env:
          DEB: ${{ steps.build.outputs.deb }}
          TRANS_DEB: ${{ steps.build.outputs.transitional }}
          IMAGE_DEB: ${{ steps.image.outputs.deb }}
        run: |
          docker run --rm -v "$PWD:/work" debian:13 \
            bash /work/packaging/tests/repo-test.sh "/work/$DEB" "/work/$TRANS_DEB" "/work/$IMAGE_DEB"
      # 빌드 버전 시험을 OPL_VERSION을 준 빌드로 다시 돌린다(clap 기본 version으로 되돌리면 실패한다).
      - name: Version tests with OPL_VERSION
        run: OPL_VERSION=9.9.9~t cargo test -p opl-types -p opld -p oplctl --lib --test version
      - uses: actions/upload-artifact@v4
        with:
          name: orbivisor-deb
          path: dist/*_amd64.deb

  # M7: 실제 KVM으로 VM을 띄우고 NIC를 브리지에 잇는다. tap과 브리지를 만들려면 root가 필요하고,
  # QEMU는 systemd 스코프로 감싼다(OPL_TEST_SYSTEMD). 웹 UI E2E는 브라우저로 같은 opld를 다룬다.
  # 라이브 마이그레이션 E2E는 한 호스트의 opld 둘로 공유 디렉터리·NFS·RBD·공유 LVM 풀 위의 VM을 옮긴다
  # (두 노드의 스코프 이름이 겹치므로 그 시험만 스코프를 끈다).
  # vTPM(계획 59, vtpm-it): 실제 swtpm으로 TPM VM의 상태 만들기·해시·초기화, 두 노드 사이 옮기기·받아 오기, 사본 노드로의
  # HA 복구를 본다. 시험 디렉터리는 /tmp 아래라 Ubuntu swtpm AppArmor 프로필(`/tmp/** rwk`)이 막지 않는다.
  linux-kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    # root로 도는 테스트도 runner가 설치한 브라우저를 쓴다.
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: KVM, QEMU, UEFI firmware, swtpm, iproute2, nftables
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config qemu-system-x86 ovmf qemu-utils iproute2 nftables swtpm swtpm-tools
          ls -l /dev/kvm
          swtpm --version
          ls /usr/share/qemu/firmware
      # 계획 60 Prometheus 긁기 시험이 받은 본문을 `promtool check metrics`로도 본다(OPL_TEST_PROMTOOL). 꾸러미가 띄우는
      # prometheus 서비스는 쓰지 않으므로 멈춘다.
      - name: promtool
        run: |
          sudo apt-get install -y --no-install-recommends prometheus
          sudo systemctl stop prometheus || echo "prometheus service was not running"
          promtool --version
      # TPM 능력 확인이 보는 것(GitHub 탐침 2): 거짓 음성이면 시험의 opld 로그 줄과 견준다.
      - name: TPM capability diagnostics
        run: |
          swtpm --version
          swtpm socket --print-capabilities
          qemu-system-x86_64 -tpmdev help 2>&1 && rc=0 || rc=$?; echo "exit status $rc"
          sudo aa-status 2>/dev/null | grep -i swtpm || echo "no swtpm AppArmor profile loaded"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web UI and browser
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build
          pnpm -C web exec playwright install --with-deps chromium
      # NFS 풀 E2E가 마운트할 내보내기. root로 마운트한 opld가 쓰도록 root를 그대로 둔다.
      - name: NFS server exporting a test directory
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-kernel-server
          sudo mkdir -p /srv/opl-nfs
          echo '/srv/opl-nfs 127.0.0.1(rw,sync,no_subtree_check,no_root_squash)' | sudo tee -a /etc/exports
          sudo systemctl restart nfs-kernel-server
          sudo exportfs -v
      # LVM-thin 풀 시험이 LV를 만들 VG `opltest`와 thin pool `tp`. 루프 장치 위에 둔다.
      - name: LVM thin pool on a loop device
        run: |
          sudo apt-get update
          sudo apt-get install -y lvm2 thin-provisioning-tools
          sudo modprobe dm_thin_pool
          truncate -s 2G "$RUNNER_TEMP/opltest.img"
          LOOP=$(sudo losetup --find --show "$RUNNER_TEMP/opltest.img")
          sudo pvcreate -y "$LOOP"
          sudo vgcreate opltest "$LOOP"
          sudo lvcreate -y -T -L 1G opltest/tp
          sudo lvs opltest
      # ZFS 풀 시험이 zvol을 만들 데이터셋 `opltestz/opl`. zpool은 파일 하나 위에 둔다.
      - name: ZFS pool on a file
        run: |
          sudo apt-get update
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs
          sudo udevadm control --reload-rules
          truncate -s 2G "$RUNNER_TEMP/opltestz.img"
          sudo zpool create opltestz "$RUNNER_TEMP/opltestz.img"
          sudo zfs create opltestz/opl
          sudo zfs list -r opltestz
          zfs version
          sudo zpool status opltestz
      # RBD 풀 시험이 이미지를 만들 Ceph 풀 `rbd`. Ubuntu apt 패키지(ceph 19.2)로 노드 하나짜리 Ceph(모니터·
      # 매니저 하나, 4G 성긴 파일 위 BlueStore OSD 하나, 복제 1)를 손으로 띄운다(snap 스토어가 러너에서
      # 닿지 않을 때가 있어 microceph를 쓰지 않는다). ceph-common의 rbd·ceph와 QEMU(qemu-block-extra의
      # librbd)가 읽도록 ceph.conf와 관리자 키링을 Ceph 기본 위치 /etc/ceph에 둔다. 제한된 사용자 시험을
      # 위해 네임스페이스 `rbd/opl`과 사용자 `client.opltest`(caps `profile rbd`)를 만들고, 그 키링은 Ceph
      # 기본 위치가 아닌 /etc/opl-ceph에 두어 그곳의 ceph.conf로만 찾게 한다.
      - name: Ceph (apt, single node) with an rbd pool
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y ceph-mon ceph-mgr ceph-osd ceph-common qemu-block-extra jq uuid-runtime
          # 모니터·매니저·OSD를 모두 이 호스트의 127.0.0.1에 묶는다. 복제 1을 허용하고 CRUSH 장애 도메인을
          # OSD로 둔다(호스트가 하나뿐이다).
          FSID=$(uuidgen)
          HOST=$(hostname -s)
          sudo mkdir -p /etc/ceph
          sudo tee /etc/ceph/ceph.conf >/dev/null <<CONF
          [global]
          fsid = $FSID
          mon_initial_members = $HOST
          mon_host = [v2:127.0.0.1:3300,v1:127.0.0.1:6789]
          public_addr = 127.0.0.1
          cluster_addr = 127.0.0.1
          auth_cluster_required = cephx
          auth_service_required = cephx
          auth_client_required = cephx
          osd_pool_default_size = 1
          osd_pool_default_min_size = 1
          mon_allow_pool_size_one = true
          osd_crush_chooseleaf_type = 0
          mon_warn_on_insecure_global_id_reclaim_allowed = false
          CONF
          # 모니터: 키링(mon., client.admin)과 monmap을 만들어 저장소를 초기화한다.
          sudo ceph-authtool --create-keyring /etc/ceph/ceph.client.admin.keyring --gen-key -n client.admin \
            --cap mon 'allow *' --cap osd 'allow *' --cap mds 'allow *' --cap mgr 'allow *'
          sudo ceph-authtool --create-keyring /var/lib/ceph/tmp/ceph.mon.keyring --gen-key -n mon. --cap mon 'allow *'
          sudo ceph-authtool /var/lib/ceph/tmp/ceph.mon.keyring --import-keyring /etc/ceph/ceph.client.admin.keyring
          sudo monmaptool --create --addv "$HOST" '[v2:127.0.0.1:3300,v1:127.0.0.1:6789]' --fsid "$FSID" /var/lib/ceph/tmp/monmap
          sudo chown ceph:ceph /var/lib/ceph/tmp/ceph.mon.keyring /var/lib/ceph/tmp/monmap
          sudo -u ceph mkdir -p "/var/lib/ceph/mon/ceph-$HOST"
          sudo -u ceph ceph-mon --mkfs -i "$HOST" --monmap /var/lib/ceph/tmp/monmap --keyring /var/lib/ceph/tmp/ceph.mon.keyring
          sudo rm -f /var/lib/ceph/tmp/ceph.mon.keyring /var/lib/ceph/tmp/monmap
          sudo systemctl start "ceph-mon@$HOST"
          trap 'sudo ceph -s || true' EXIT
          # 조건이 맞을 때까지 5초마다, 최대 10분 기다린다.
          wait_for() {
            for _ in $(seq 120); do
              if "$@"; then return 0; fi
              sleep 5
            done
            return 1
          }
          wait_for sudo timeout 10 ceph mon stat
          # 매니저(PG 상태와 `ceph df`가 매니저를 거친다).
          sudo -u ceph mkdir -p "/var/lib/ceph/mgr/ceph-$HOST"
          sudo ceph auth get-or-create "mgr.$HOST" mon 'allow profile mgr' osd 'allow *' mds 'allow *' \
            | sudo -u ceph tee "/var/lib/ceph/mgr/ceph-$HOST/keyring" >/dev/null
          sudo systemctl start "ceph-mgr@$HOST"
          # OSD 하나: 블록 장치 대신 4G 성긴 파일 위의 BlueStore.
          OSD_UUID=$(uuidgen)
          OSD_ID=$(sudo ceph osd new "$OSD_UUID")
          sudo -u ceph mkdir -p "/var/lib/ceph/osd/ceph-$OSD_ID"
          sudo ceph auth get-or-create "osd.$OSD_ID" mon 'allow profile osd' mgr 'allow profile osd' osd 'allow *' \
            | sudo -u ceph tee "/var/lib/ceph/osd/ceph-$OSD_ID/keyring" >/dev/null
          sudo -u ceph truncate -s 4G "/var/lib/ceph/osd/ceph-$OSD_ID/block"
          sudo -u ceph ceph-osd -i "$OSD_ID" --mkfs --osd-uuid "$OSD_UUID" --osd-objectstore bluestore
          sudo systemctl start "ceph-osd@$OSD_ID"
          wait_for sh -c 'sudo ceph osd stat | grep -q " 1 up"'
          wait_for sh -c 'sudo ceph mgr stat --format json | jq -e .available'
          sudo ceph osd pool create rbd 32
          sudo ceph osd pool set rbd size 1 --yes-i-really-mean-it
          sudo ceph osd pool set .mgr size 1 --yes-i-really-mean-it || true
          wait_for sh -c "sudo ceph status --format json | jq -e '.pgmap.num_pgs > 0 and ([.pgmap.pgs_by_state[] | select(.state_name | startswith(\"active\")) | .count] | add) == .pgmap.num_pgs'"
          sudo rbd pool init rbd
          sudo rbd create --size 1 rbd/opl-ci-probe
          sudo rbd rm --no-progress rbd/opl-ci-probe
          sudo ceph df
          sudo rbd namespace create rbd/opl
          sudo mkdir -p /etc/opl-ceph
          sudo ceph auth get-or-create client.opltest mon 'profile rbd' osd 'profile rbd pool=rbd' mgr 'profile rbd pool=rbd' \
            | sudo tee /etc/opl-ceph/opltest.keyring >/dev/null
          { sudo cat /etc/ceph/ceph.conf; printf '\n[client.opltest]\nkeyring = /etc/opl-ceph/opltest.keyring\n'; } \
            | sudo tee /etc/opl-ceph/ceph.conf >/dev/null
          sudo rbd --id opltest --conf /etc/opl-ceph/ceph.conf ls --pool rbd --namespace opl
          sudo ceph --id opltest --conf /etc/opl-ceph/ceph.conf df detail >/dev/null
      # 공유 LVM 풀 시험이 LV를 만들 공유 VG `oplshared`. targetcli(LIO)로 파일 백스토어 LUN 하나를
      # 내보내는 루프백 iSCSI 타깃(데모 모드 ACL, 인증 없음)을 만들어 open-iscsi로 로그인하고,
      # lvmlockd와 sanlock(softdog 감시, host_id 1)으로 그 LUN 위에 공유 VG를 만든다. lvmlockd는 호스트
      # 전체에 켜지지만 로컬 VG(LVM-thin 시험)는 그대로 쓴다. E2E는 잠금을 멈추고 로그아웃한 뒤 opld가
      # 다시 로그인하고 잠금을 시작하게 한다.
      - name: iSCSI target and a shared (lvmlockd) VG
        timeout-minutes: 10
        env:
          IQN: iqn.2003-01.org.linux-iscsi.opl:shared
        run: |
          sudo apt-get update
          sudo apt-get install -y targetcli-fb open-iscsi lvm2-lockd sanlock
          sudo modprobe target_core_mod
          sudo modprobe iscsi_target_mod
          sudo systemctl start iscsid
          truncate -s 2G "$RUNNER_TEMP/oplshared.img"
          sudo targetcli /backstores/fileio create oplshared "$RUNNER_TEMP/oplshared.img"
          sudo targetcli /iscsi create "$IQN"
          sudo targetcli "/iscsi/$IQN/tpg1/luns" create /backstores/fileio/oplshared
          sudo targetcli "/iscsi/$IQN/tpg1" set attribute authentication=0 demo_mode_write_protect=0 generate_node_acls=1 cache_dynamic_acls=1
          sudo targetcli ls
          sudo iscsiadm -m discovery -t sendtargets -p 127.0.0.1
          sudo iscsiadm -m node -T "$IQN" -p 127.0.0.1 --login
          sudo udevadm settle
          sudo iscsiadm -m session
          DEV="/dev/disk/by-path/ip-127.0.0.1:3260-iscsi-$IQN-lun-0"
          # udev가 by-path 링크를 settle 뒤에 조금 늦게 만들 때가 있다.
          for _ in $(seq 30); do [ -e "$DEV" ] && break; sleep 1; done
          ls -l "$DEV"
          sudo modprobe softdog
          sudo sed -i 's/^\s*#\?\s*use_lvmlockd = .*/\tuse_lvmlockd = 1/' /etc/lvm/lvm.conf
          printf 'local {\n\thost_id = 1\n}\n' | sudo tee /etc/lvm/lvmlocal.conf
          sudo lvmconfig global/use_lvmlockd local/host_id
          sudo systemctl start wdmd sanlock lvmlockd
          sudo vgcreate --shared oplshared "$DEV"
          sudo vgchange --lockstart oplshared
          sudo vgs -o vg_name,vg_lock_type,vg_size,vg_free oplshared
          sudo lvs opltest
      # root로 빌드하므로 캐시하지 않고 임시 디렉터리에 빌드한다.
      - name: QEMU, bridge and E2E tests as root
        run: |
          sudo -E env "PATH=$PATH" OPL_TEST_SYSTEMD=1 CARGO_TARGET_DIR="$RUNNER_TEMP/target" \
            cargo test --features "$FEATURES" -p opl-qemu -p opl-driver -p opl-reconciler -p opld
        env:
          FEATURES: opl-qemu/qemu-it,opl-driver/qemu-it,opl-driver/net-it,opl-reconciler/qemu-it,opld/qemu-it,opld/net-it,opld/web-it,opld/nfs-it,opl-driver/lvm-it,opld/lvm-it,opl-driver/zfs-it,opld/zfs-it,opl-driver/rbd-it,opld/rbd-it,opl-driver/lvm-shared-it,opld/lvm-shared-it,opld/migration-it,opld/ha-it,opl-driver/vtpm-it,opld/vtpm-it,opld/cpu-it,opld/numa-it,opld/backup-it
          OPL_TEST_NFS_EXPORT: /srv/opl-nfs
          OPL_TEST_LVM: opltest/tp
          OPL_TEST_ZFS: opltestz/opl
          OPL_TEST_RBD: rbd
          OPL_TEST_RBD_USER: opltest
          OPL_TEST_RBD_NAMESPACE: opl
          OPL_TEST_RBD_CONF: /etc/opl-ceph/ceph.conf
          OPL_TEST_LVM_SHARED: oplshared
          OPL_TEST_ISCSI: 127.0.0.1,iqn.2003-01.org.linux-iscsi.opl:shared
          OPL_TEST_PROMTOOL: promtool
          # 계획 64: NUMA 탐침 시험이 2M hugepages를 실행 중 예약했다가 되돌린다(`/sys` 쓰기).
          OPL_TEST_NUMA_SYS: "1"

  # 파일 단위 복원(계획 69 설계 §14): 도우미 이미지 빌드(x86_64를 두 번 — 바이트가 같아야 한다, aarch64는 빌드만 — 부팅은
  # svc01)와 시험 게스트(--test-guest, Debian qemu-guest-agent), 고정물 디스크 전체(btrfs·ntfs 포함, LVM은 root, XFS 더러운
  # 로그), 실제 QEMU 도우미 시험(restore-it — KVM·root·systemd scope·권한 내림), opld E2E (1)~(5)((5)는 실제 게스트 에이전트로
  # 되돌려 쓰기), 그리고 `-accel tcg`를 강제한 도우미 시험 한 번. 부팅 시간·흘리기 MB/s는 로그의 PROBE 줄과 E2E 출력.
  file-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPL_RESTORE_IMAGE_DIR: ${{ github.workspace }}/../fr/img
      OPL_RESTORE_FIXTURES: ${{ github.workspace }}/../fr/fx
      OPL_RESTORE_TEST_GUEST: ${{ github.workspace }}/../fr/guest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: KVM, QEMU and fixture tools
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config qemu-system-x86 qemu-utils ovmf libarchive-tools zstd \
            e2fsprogs xfsprogs btrfs-progs dosfstools mtools exfatprogs ntfs-3g fdisk cryptsetup-bin lvm2 \
            thin-provisioning-tools unzip
          ls -l /dev/kvm
          qemu-system-x86_64 --version
          mkdir -p "$OPL_RESTORE_IMAGE_DIR" "$OPL_RESTORE_FIXTURES" "$OPL_RESTORE_TEST_GUEST"
      # 같은 입력(잠금 파일의 deb, 같은 에이전트)이면 같은 바이트다(설계 §8.2) — 두 번 빌드해 견준다.
      - name: Helper images (x86_64 twice, aarch64) and the test guest
        env:
          CACHE: ${{ runner.temp }}/debs
        run: |
          packaging/restore-image/build.sh --arch x86_64 --cache "$CACHE" --out "$OPL_RESTORE_IMAGE_DIR/x86_64"
          # 둘째 빌드는 새 CARGO_TARGET_DIR로 — 에이전트 빌드까지 재현되는지 본다(설계 §8.2).
          CARGO_TARGET_DIR="$RUNNER_TEMP/again-target" \
            packaging/restore-image/build.sh --arch x86_64 --cache "$CACHE" --out "$RUNNER_TEMP/again/x86_64"
          (cd "$OPL_RESTORE_IMAGE_DIR/x86_64" && sha256sum vmlinuz initrd.img manifest.json) | tee "$RUNNER_TEMP/first.sum"
          (cd "$RUNNER_TEMP/again/x86_64" && sha256sum vmlinuz initrd.img manifest.json) >"$RUNNER_TEMP/second.sum"
          diff "$RUNNER_TEMP/first.sum" "$RUNNER_TEMP/second.sum"
          packaging/restore-image/build.sh --arch aarch64 --cache "$CACHE" --out "$RUNNER_TEMP/arm/aarch64"
          packaging/restore-image/build.sh --arch x86_64 --cache "$CACHE" --test-guest --out "$OPL_RESTORE_TEST_GUEST"
          ls -l "$OPL_RESTORE_IMAGE_DIR/x86_64" "$RUNNER_TEMP/arm/aarch64" "$OPL_RESTORE_TEST_GUEST"
      # LVM(VG oplfixvg)은 root가 만든다. XFS 더러운 로그: 복사본을 붙여 쓰고 fsync한 뒤 로그를 남긴 채 내린다.
      - name: Fixture disks
        run: |
          sudo crates/opl-restore/tests/fixtures/make-disks.sh "$OPL_RESTORE_FIXTURES"
          cat "$OPL_RESTORE_FIXTURES/disks.txt"
          sudo cp --sparse=always "$OPL_RESTORE_FIXTURES/xfs.img" "$OPL_RESTORE_FIXTURES/xfs-dirty.img"
          sudo mkdir -p /mnt/oplxfs
          sudo mount -o loop "$OPL_RESTORE_FIXTURES/xfs-dirty.img" /mnt/oplxfs
          printf 'replayed\n' | sudo tee /mnt/oplxfs/replay.txt >/dev/null
          sudo xfs_io -c fsync /mnt/oplxfs/replay.txt
          sudo xfs_io -x -c shutdown /mnt/oplxfs
          sudo umount /mnt/oplxfs
          sudo chown -R "$(id -u):$(id -g)" "$OPL_RESTORE_FIXTURES"
          ls -l "$OPL_RESTORE_FIXTURES"
      # root로 빌드하므로 캐시하지 않고 임시 디렉터리에 빌드한다(linux-kvm과 같음).
      - name: Real helper VM (KVM) and opld E2E (1)-(5)
        run: |
          sudo -E env "PATH=$PATH" OPL_RESTORE_SCOPE=1 OPL_TEST_SYSTEMD=1 CARGO_TARGET_DIR="$RUNNER_TEMP/target" \
            cargo test -p opl-driver --features restore-it --test restore_helper -- --nocapture --test-threads 1
          sudo -E env "PATH=$PATH" OPL_TEST_SYSTEMD=1 CARGO_TARGET_DIR="$RUNNER_TEMP/target" \
            cargo test -p opld --features restore-it --test file_restore -- --nocapture
      - name: Real helper VM with forced TCG
        run: |
          sudo -E env "PATH=$PATH" OPL_RESTORE_ACCEL=tcg CARGO_TARGET_DIR="$RUNNER_TEMP/target" \
            cargo test -p opl-driver --features restore-it --test restore_helper -- --nocapture --test-threads 1

  # Ceph 자동 구성(계획 56): Ceph가 없는 깨끗한 러너에서 orbivisord가 apt로 Ceph를 설치하고 mon·mgr, 루프 장치
  # 위 OSD(ceph-volume LVM), RBD 풀을 세워 그 풀의 볼륨으로 VM을 켠다. linux-kvm은 손으로 띄운 Ceph(바깥 Ceph를
  # RBD 풀로 쓰는 시험)의 /etc/ceph/ceph.conf가 있어 Orbivisor가 관리할 Ceph를 세울 수 없으므로 작업을 나눈다.
  ceph:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: QEMU, UEFI firmware, rbd block driver (Ceph itself is installed by orbivisord)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config qemu-system-x86 ovmf qemu-utils qemu-block-extra
          ls -l /dev/kvm
          test ! -e /etc/ceph/ceph.conf
      # root로 빌드하므로 캐시하지 않고 임시 디렉터리에 빌드한다. 실제 Ceph 출력(JSON)을 로그에 남긴다.
      - name: Ceph setup E2E as root
        run: |
          sudo -E env "PATH=$PATH" CARGO_TARGET_DIR="$RUNNER_TEMP/target" \
            cargo test --features opld/ceph-it,opld/qemu-it -p opld --test ceph -- --nocapture

  # SDN(OVN) 설치·구성(계획 65): 깨끗한 Ubuntu 24.04 러너에서 orbivisord가 직접 ovn-central·ovn-host·openvswitch-switch를 apt로
  # 받아 NB·SB Raft 클러스터·northd(Orbivisor 단위, 노드 주소의 pssl, 클러스터 CA mTLS)와 chassis를 세우고, 127.0.0.2의
  # ovsdb-server 한 쌍으로 두 번째 중앙의 합류·떠나기를 본다. 실제 OVN 출력(판, cluster/status, ovs-vsctl JSON)을 로그에 남긴다.
  # 리더 OvnSync의 NB 쓰기·펜싱과, 이름공간 둘의 OVS 내부 포트(게스트 없는 "VM")로 OVN DHCP(busybox udhcpc)·ping·포트 보안을 본다.
  # QEMU VM의 SDN NIC가 br-int에 바인딩되고(SB Port_Binding·NB up·ovn-installed) 클라우드 이미지 게스트가 OVN DHCP로 주소를 받는지 본다.
  # 계획 66: 노드 physnet(Linux 브리지 oplext0에 veth·OVS 브리지·ovn-bridge-mappings, 게이트웨이 표시)과 localnet으로 이름공간 ext에
  # 닿는지, veth를 다시 만드는지, 빼면 내 것만 치우는지 본다. 라우터·SNAT·유동 IP·RA·DHCPv6·보안 그룹(OVN ACL과 nftables의
  # 같은 뜻)을 orbivisorctl(node sdn·network create --provider·router·fip)로 만들어 보고, 클라우드 이미지 게스트가 cloud-init
  # ipv6_slaac로 EUI-64 주소를 쓰는지 본다. 계획 67: OVN 부하 분산(분산 VIP·건강 검사 넘김·reject·바깥 VIP·출발지 고정)과
  # NIC QoS(OVN QoS 행의 iperf3 속도·DSCP, 단순 NIC tc police)를 실제로 잰다(값은 로그의 "PROBE" 줄).
  ovn:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: QEMU (OVN itself is installed by orbivisord)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libssl-dev pkg-config qemu-system-x86 ovmf qemu-utils busybox tcpdump nftables python3 iperf3
          test ! -e /etc/ovn
          test ! -e /etc/openvswitch
          if dpkg -s ovn-central >/dev/null 2>&1 || dpkg -s openvswitch-switch >/dev/null 2>&1; then exit 1; fi
      # 포트 바인딩 시험(스테이지 5)의 게스트: SDN NIC의 VM이 OVN DHCP로 IPAM 주소를 받는지, SLAAC 서브넷에서 EUI-64를 쓰는지
      # (계획 66) 본다.
      - name: Cloud image
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -O https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img
          curl -fsSL --retry 3 -O https://cloud-images.ubuntu.com/releases/24.04/release/SHA256SUMS
          grep -E '[ *]ubuntu-24\.04-server-cloudimg-amd64\.img$' SHA256SUMS | sha256sum -c -
          ls -l /dev/kvm || true
      # root로 빌드하므로 캐시하지 않고 임시 디렉터리에 빌드한다.
      - name: OVN setup E2E as root
        run: |
          sudo -E env "PATH=$PATH" CARGO_TARGET_DIR="$RUNNER_TEMP/target" \
            OPL_TEST_CLOUD_IMAGE="$RUNNER_TEMP/ubuntu-24.04-server-cloudimg-amd64.img" \
            cargo test --features opld/sdn-it -p opld --test sdn -- --nocapture

  # 여러 노드 SDN(계획 66 스테이지 6): 러너 하나에 privileged systemd 컨테이너 셋(ci/sdn-node/Dockerfile — OVN·OVS는 넣지 않음)을
  # Orbivisor 노드 셋으로 띄우고, 노드마다 orbivisord가 apt로 OVN을 깔아 실제 NB·SB Raft 셋과 chassis 셋이 된다(커널 모듈만
  # 호스트가 올린다). orbivisorctl로 컨테이너 사이 Geneve 동서 라우팅, SNAT, 분산·중앙 유동 IP, 게이트웨이 넘김(ovn-controller
  # 멈춤·kill -9·docker kill 노드 통째)과 되돌아감, 죽은 중앙의 실제 cluster/kick, 두 chassis 라이브 마이그레이션(게스트 없는
  # QEMU VM)을 본다. 계획 67: 여러 chassis 보안 그룹, 부하 분산(멤버 c1·c3, 손님 c2, 바깥 VIP의 게이트웨이 넘김), Geneve 너머
  # QoS(iperf3), VXLAN 원본의 옮기기 다리(다리 노드 바꾸기), 잠금, 지운 노드 끊기, 호스트 webhook으로 받는 SDN 경보. 넘김 시간은
  # 로그의 "PROBE" 줄.
  sdn-multinode:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Kernel modules, tcpdump, node image
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config tcpdump
          sudo modprobe -a openvswitch geneve vxlan
          sudo modprobe vport_geneve || echo "no vport_geneve module"
          lsmod | grep -E 'openvswitch|geneve|vxlan'
          ls -l /dev/kvm || true
          docker version --format '{{.Server.Version}}'
          docker build -t opl-sdn-node ci/sdn-node
      # root로 빌드하므로 캐시하지 않고 임시 디렉터리에 빌드한다.
      - name: Multinode SDN E2E as root
        run: |
          sudo -E env "PATH=$PATH" CARGO_TARGET_DIR="$RUNNER_TEMP/target" OPL_MULTINODE_IMAGE=opl-sdn-node \
            cargo test --features opld/sdn-multinode-it -p opld --test sdn_multinode -- --nocapture

  # 설치 매체와 cloud-init(계획 57)의 실제 게스트: 받아 둔 Alpine virt ISO로 BIOS·UEFI VM이 CD에서 부팅하는지, Ubuntu
  # 24.04 클라우드 이미지에 cloud-init이 호스트 이름·사용자·비밀번호 해시·키·고정 IP를 적용하는지 본다. 게스트 OS가 있어야
  # 보이는 것만 여기서 보고, 나머지 CD·씨앗 시험은 linux-kvm의 qemu-it·migration-it가 돌린다.
  # 템플릿·연결 복제(계획 58): 같은 클라우드 이미지와 SHA256SUMS를 관리자 카탈로그 항목으로 받아 템플릿을 만들고, 디스크를
  # 늘린 연결 복제 둘이 cloud-init으로 켜져 보고하는지, 기반 파일이 그대로인지, 평탄화한 VM이 다시 켜지는지 본다.
  # vTPM·Secure Boot·게스트 에이전트(계획 59): 같은 클라우드 이미지를 q35·Secure Boot(ovmf의 MS 키 변수)·TPM·게스트
  # 에이전트로 켜 게스트가 sysfs의 TPM 2.0·Secure Boot efivar·EK(/dev/tpmrm0의 TPM2_ReadPublic)를 보고하는지, 다시 켜도
  # EK가 같고 복제는 다른지 본다(보고는 파이썬 표준 라이브러리만 쓴다). `vm guest`의 OS·IP와 에이전트 종료는 게스트가
  # qemu-guest-agent를 apt로 받았을 때만 본다(1~2분, 받지 못하면 건너뜀).
  install-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: KVM, QEMU, UEFI firmware
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config qemu-system-x86 ovmf qemu-utils swtpm swtpm-tools
          ls -l /dev/kvm
          ls /usr/share/qemu/firmware
          # root가 아닌 사용자의 swtpm_setup은 /var/lib/swtpm-localca(tss 소유) 대신 ~/.config의 설정과 CA를 쓴다.
          swtpm_setup --create-config-files skip-if-exist
      # TPM 능력 확인이 보는 것(GitHub 탐침 2): 거짓 음성이면 시험의 opld 로그 줄과 견준다.
      - name: TPM capability diagnostics
        run: |
          swtpm --version
          swtpm socket --print-capabilities
          qemu-system-x86_64 -tpmdev help 2>&1 && rc=0 || rc=$?; echo "exit status $rc"
          sudo aa-status 2>/dev/null | grep -i swtpm || echo "no swtpm AppArmor profile loaded"
      # 받기 실패는 시험 실패가 아니라 이 단계의 실패로 보인다.
      - name: Cloud image and installer ISO
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -O https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img
          curl -fsSL --retry 3 -O https://cloud-images.ubuntu.com/releases/24.04/release/SHA256SUMS
          grep -E '[ *]ubuntu-24\.04-server-cloudimg-amd64\.img$' SHA256SUMS | sha256sum -c -
          curl -fsSL --retry 3 -O https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-virt-3.20.3-x86_64.iso
          curl -fsSL --retry 3 -O https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-virt-3.20.3-x86_64.iso.sha256
          sha256sum -c alpine-virt-3.20.3-x86_64.iso.sha256
      - name: Installer ISO boot and cloud-init in real guests
        run: cargo test --features opld/install-media-it,opld/qemu-it -p opld --test install_media -- --nocapture
        env:
          OPL_TEST_CLOUD_IMAGE: ${{ runner.temp }}/ubuntu-24.04-server-cloudimg-amd64.img
          OPL_TEST_INSTALL_ISO: ${{ runner.temp }}/alpine-virt-3.20.3-x86_64.iso
      - name: Templates and linked clones in real guests
        run: cargo test --features opld/templates-it,opld/qemu-it -p opld --test templates -- --nocapture
        env:
          OPL_TEST_CLOUD_IMAGE: ${{ runner.temp }}/ubuntu-24.04-server-cloudimg-amd64.img
          OPL_TEST_CLOUD_SUMS: ${{ runner.temp }}/SHA256SUMS
      - name: vTPM, Secure Boot and the guest agent in a real guest
        run: cargo test --features opld/vtpm-it,opld/install-media-it,opld/qemu-it -p opld --test vtpm -- --nocapture
        env:
          OPL_TEST_CLOUD_IMAGE: ${{ runner.temp }}/ubuntu-24.04-server-cloudimg-amd64.img

  # 백업 저장소를 실제 S3 호환 저장소(SeaweedFS)로(계획 68 §14): HTTP 끝점과 사용자 CA로 서명한 HTTPS 끝점(SeaweedFS 컨테이너 둘,
  # 태그를 못 박음), GC와 백업 동시·평문 표식 없음, S3 저장소 멈춤(`docker pause`) 도중의 백업·라이브 복원(헬퍼 kill -9·opld 다시
  # 시작·90초 멈춤), 두 클러스터 DR(읽기 전용 붙이기·escrow·scan·라이브 복원·넘겨받기). VM은 KVM으로, root가 아니다.
  backup-s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # MinIO는 2025년 가을부터 이미지·바이너리를 내지 않아(quay 401, dl.min.io 410) SeaweedFS S3로 시험한다.
      S3_IMAGE: chrislusf/seaweedfs:4.50
      OPL_S3_ENDPOINT: http://127.0.0.1:9000
      OPL_S3_TLS_ENDPOINT: https://127.0.0.1:9443
      OPL_S3_CA: /tmp/opl-s3-certs/ca.pem
      OPL_S3_ACCESS_KEY: opl-ci-access
      OPL_S3_SECRET_KEY: opl-ci-secret-key-1234
      OPL_S3_BUCKET: orbi
      OPL_S3_CONTAINER: opl-s3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: KVM, QEMU, qemu-utils
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config qemu-system-x86 ovmf qemu-utils
          ls -l /dev/kvm
      # 시험 CA와 127.0.0.1 인증서(SeaweedFS `-s3.cert.file`·`-s3.key.file`)
      - name: Test CA and a server certificate
        run: |
          d=/tmp/opl-s3-certs
          mkdir -p "$d"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 2 \
            -subj "/CN=opl s3 test ca" -keyout "$d/ca.key" -out "$OPL_S3_CA"
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -subj "/CN=127.0.0.1" \
            -keyout "$d/private.key" -out "$d/server.csr"
          printf 'subjectAltName=IP:127.0.0.1,DNS:localhost\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' > "$d/ext"
          openssl x509 -req -in "$d/server.csr" -CA "$OPL_S3_CA" -CAkey "$d/ca.key" -CAcreateserial -days 2 \
            -extfile "$d/ext" -out "$d/public.crt"
          chmod 0644 "$d/private.key"
          openssl verify -CAfile "$OPL_S3_CA" "$d/public.crt"
      - name: SeaweedFS S3 over HTTP and HTTPS, and the bucket
        run: |
          d=/tmp/opl-s3-certs
          printf '{"identities":[{"name":"opl","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
            "$OPL_S3_ACCESS_KEY" "$OPL_S3_SECRET_KEY" > "$d/s3.json"
          chmod 0644 "$d/s3.json"
          docker run -d --name "$OPL_S3_CONTAINER" -p 127.0.0.1:9000:8333 -v "$d:/conf:ro" \
            "$S3_IMAGE" server -dir=/data -s3 -s3.port=8333 -s3.config=/conf/s3.json
          docker run -d --name opl-s3-tls -p 127.0.0.1:9443:8333 -v "$d:/conf:ro" \
            "$S3_IMAGE" server -dir=/data -s3 -s3.port=8333 -s3.config=/conf/s3.json \
            -s3.cert.file=/conf/public.crt -s3.key.file=/conf/private.key
          for _ in $(seq 90); do curl -s -o /dev/null http://127.0.0.1:9000/ && break; sleep 1; done
          for _ in $(seq 90); do curl -s -o /dev/null --cacert "$OPL_S3_CA" https://127.0.0.1:9443/ && break; sleep 1; done
          export AWS_ACCESS_KEY_ID="$OPL_S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$OPL_S3_SECRET_KEY" AWS_DEFAULT_REGION=us-east-1
          for _ in $(seq 30); do aws --endpoint-url "$OPL_S3_ENDPOINT" s3 mb "s3://$OPL_S3_BUCKET" && break; sleep 2; done
          for _ in $(seq 30); do aws --endpoint-url "$OPL_S3_TLS_ENDPOINT" --ca-bundle "$OPL_S3_CA" s3 mb "s3://$OPL_S3_BUCKET" && break; sleep 2; done
          aws --endpoint-url "$OPL_S3_ENDPOINT" s3 ls
          docker exec "$OPL_S3_CONTAINER" weed version
      - name: Backup store E2E against S3 (SeaweedFS)
        timeout-minutes: 60
        run: cargo test -p opld --features s3-it --test backup_s3 -- --nocapture --test-threads=1
      - name: S3 server logs
        if: failure()
        run: |
          docker logs --tail 200 "$OPL_S3_CONTAINER" || true
          docker logs --tail 200 opl-s3-tls || true

  # LDAP 영역: 실제 OpenLDAP(slapd)에 LDAPS와 ldap://+StartTLS로 사용자 찾기·바인드, memberOf 그룹,
  # API의 영역 시험 동작과 외부 사용자 로그인. 디렉터리(시험 CA, 사용자 둘, 그룹 하나)는
  # ldap-setup.sh가 아래 OPL_TEST_LDAP_* 값으로 만든다.
  ldap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPL_TEST_LDAP_URL: "ldaps://127.0.0.1:636"
      OPL_TEST_LDAP_STARTTLS_URL: "ldap://127.0.0.1:389"
      OPL_TEST_LDAP_CA: /tmp/opl-test-ldap-ca.pem
      OPL_TEST_LDAP_BASE_DN: "dc=example,dc=com"
      OPL_TEST_LDAP_BIND_DN: "cn=admin,dc=example,dc=com"
      OPL_TEST_LDAP_BIND_PASSWORD: opl-admin-pw
      OPL_TEST_LDAP_USER: alice
      OPL_TEST_LDAP_USER_PASSWORD: alice-pw
      OPL_TEST_LDAP_OTHER_USER: bob
      OPL_TEST_LDAP_OTHER_PASSWORD: bob-pw
      OPL_TEST_LDAP_GROUP: "cn=admins,ou=groups,dc=example,dc=com"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: OpenSSL headers (native-tls)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: slapd with LDAPS, StartTLS, two users and a group
        run: sudo -E sh .github/scripts/ldap-setup.sh
      - run: cargo test -p opl-api --features ldap-it --test ldap_it
      - name: slapd log
        if: failure()
        run: sudo journalctl -u slapd --no-pager -n 200

  # VMware 이전(계획 72 §14): govmomi vcsim을 상대로 우리 손 SOAP 클라이언트의 꼴(로그인·결함·인벤토리 쪽 나눔·CBT 켜기·
  # 스냅샷·전원·티켓·/folder 범위 읽기)과 가짜 vSphere가 같은 꼴을 내는지 본다. vcsim·govc는 govmomi 릴리스 실행 파일을
  # 판을 박아 받고 SHA-256을 확인한다(컨테이너 없이). nbdkit(우분투 꾸러미)의 file 플러그인을 vddk 자리에 두고
  # VDDK 읽기 배선도 본다. vcsim의 QueryChangedDiskAreas는 MethodNotFound다 — CBT 의미는 가짜 vSphere 시험이 맡는다.
  vmware-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOVMOMI_VERSION: v0.56.2
      VCSIM_SHA256: 4c79fd49d94ffdb7a9095350ff71f38e77e90036bd0bc26b50362219ac88fd13
      GOVC_SHA256: 12889f30e42e868487041f6628e9789606c80e13a194fb37c099abffc92d5a59
      OPL_TEST_VCSIM: "127.0.0.1:8989"
      OPL_TEST_VCSIM_USER: user
      OPL_TEST_VCSIM_PASSWORD: pass
      OPL_TEST_NBDKIT: /usr/sbin/nbdkit
      GOVC_URL: "https://user:pass@127.0.0.1:8989/sdk"
      GOVC_INSECURE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: OpenSSL headers (native-tls) and nbdkit
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config nbdkit
          nbdkit --version
      - name: govmomi vcsim and govc (pinned release, SHA-256 checked)
        run: |
          mkdir -p "$RUNNER_TEMP/govmomi" && cd "$RUNNER_TEMP/govmomi"
          base="https://github.com/vmware/govmomi/releases/download/$GOVMOMI_VERSION"
          curl -fsSL -o vcsim.tar.gz "$base/vcsim_Linux_x86_64.tar.gz"
          curl -fsSL -o govc.tar.gz "$base/govc_Linux_x86_64.tar.gz"
          echo "$VCSIM_SHA256  vcsim.tar.gz" | sha256sum -c -
          echo "$GOVC_SHA256  govc.tar.gz" | sha256sum -c -
          tar xzf vcsim.tar.gz vcsim && tar xzf govc.tar.gz govc
          echo "$RUNNER_TEMP/govmomi" >> "$GITHUB_PATH"
      - name: Start vcsim
        run: |
          nohup vcsim -l 127.0.0.1:8989 -username user -password pass > "$RUNNER_TEMP/vcsim.log" 2>&1 &
          for _ in $(seq 1 60); do govc about > /dev/null 2>&1 && break; sleep 1; done
          govc about
          govc find / -type m
      - run: cargo test -p opl-api --features vcsim-it --test vcsim -- --nocapture --test-threads=1
      - name: vcsim log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/vcsim.log"

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
