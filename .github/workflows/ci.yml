name: CI

on:
  push:
    branches: ['ci-probe/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  ovn:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: QEMU (OVN itself is installed by orbivisord)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config qemu-system-x86 ovmf qemu-utils busybox
          test ! -e /etc/ovn
          test ! -e /etc/openvswitch
          if dpkg -s ovn-central >/dev/null 2>&1 || dpkg -s openvswitch-switch >/dev/null 2>&1; then exit 1; fi
      # 포트 바인딩 시험(스테이지 5)의 게스트: SDN NIC의 VM이 OVN DHCP로 IPAM 주소를 받는지 본다.
      - name: Cloud image
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -O https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img
          curl -fsSL --retry 3 -O https://cloud-images.ubuntu.com/releases/24.04/release/SHA256SUMS
          grep -E '[ *]ubuntu-24\.04-server-cloudimg-amd64\.img$' SHA256SUMS | sha256sum -c -
          ls -l /dev/kvm || true
      # root로 빌드하므로 캐시하지 않고 임시 디렉터리에 빌드한다.
      - name: OVN setup E2E as root
        run: |
          sudo -E env "PATH=$PATH" CARGO_TARGET_DIR="$RUNNER_TEMP/target" \
            OPL_TEST_CLOUD_IMAGE="$RUNNER_TEMP/ubuntu-24.04-server-cloudimg-amd64.img" \
            cargo test --features opld/sdn-it -p opld --test sdn -- --nocapture

  # 설치 매체와 cloud-init(계획 57)의 실제 게스트: 받아 둔 Alpine virt ISO로 BIOS·UEFI VM이 CD에서 부팅하는지, Ubuntu
  # 24.04 클라우드 이미지에 cloud-init이 호스트 이름·사용자·비밀번호 해시·키·고정 IP를 적용하는지 본다. 게스트 OS가 있어야
  # 보이는 것만 여기서 보고, 나머지 CD·씨앗 시험은 linux-kvm의 qemu-it·migration-it가 돌린다.
  # 템플릿·연결 복제(계획 58): 같은 클라우드 이미지와 SHA256SUMS를 관리자 카탈로그 항목으로 받아 템플릿을 만들고, 디스크를
  # 늘린 연결 복제 둘이 cloud-init으로 켜져 보고하는지, 기반 파일이 그대로인지, 평탄화한 VM이 다시 켜지는지 본다.
  # vTPM·Secure Boot·게스트 에이전트(계획 59): 같은 클라우드 이미지를 q35·Secure Boot(ovmf의 MS 키 변수)·TPM·게스트
  # 에이전트로 켜 게스트가 sysfs의 TPM 2.0·Secure Boot efivar·EK(/dev/tpmrm0의 TPM2_ReadPublic)를 보고하는지, 다시 켜도
  # EK가 같고 복제는 다른지 본다(보고는 파이썬 표준 라이브러리만 쓴다). `vm guest`의 OS·IP와 에이전트 종료는 게스트가
  # qemu-guest-agent를 apt로 받았을 때만 본다(1~2분, 받지 못하면 건너뜀).