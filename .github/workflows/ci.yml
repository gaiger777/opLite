name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: OpenSSL headers (Linux; native-tls)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - name: Storage integration tests (qemu-img)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils
          cargo test -p opl-driver --features storage-it --test dir_storage
          cargo test -p opl-api --features storage-it --test volumes

  # 웹 UI: 타입 검사, 린트, 단위 테스트, API 타입이 Rust 정의와 같은지, 알려진 취약점, 빌드
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: OpenSSL headers (native-tls)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: API types match the Rust API
        run: |
          pnpm gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: pnpm audit --prod
      - run: pnpm build

  # M7: 실제 KVM으로 VM을 띄우고 NIC를 브리지에 잇는다. tap과 브리지를 만들려면 root가 필요하고,
  # QEMU는 systemd 스코프로 감싼다(OPL_TEST_SYSTEMD). 웹 UI E2E는 브라우저로 같은 opld를 다룬다.
  # 라이브 마이그레이션 E2E는 한 호스트의 opld 둘로 공유 디렉터리·NFS·RBD·공유 LVM 풀 위의 VM을 옮긴다
  # (두 노드의 스코프 이름이 겹치므로 그 시험만 스코프를 끈다).
  linux-kvm:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    # root로 도는 테스트도 runner가 설치한 브라우저를 쓴다.
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: KVM, QEMU, UEFI firmware, iproute2
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config qemu-system-x86 ovmf qemu-utils iproute2
          ls -l /dev/kvm
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web UI and browser
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build
          pnpm -C web exec playwright install --with-deps chromium
      # NFS 풀 E2E가 마운트할 내보내기. root로 마운트한 opld가 쓰도록 root를 그대로 둔다.
      - name: NFS server exporting a test directory
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-kernel-server
          sudo mkdir -p /srv/opl-nfs
          echo '/srv/opl-nfs 127.0.0.1(rw,sync,no_subtree_check,no_root_squash)' | sudo tee -a /etc/exports
          sudo systemctl restart nfs-kernel-server
          sudo exportfs -v
      # LVM-thin 풀 시험이 LV를 만들 VG `opltest`와 thin pool `tp`. 루프 장치 위에 둔다.
      - name: LVM thin pool on a loop device
        run: |
          sudo apt-get update
          sudo apt-get install -y lvm2 thin-provisioning-tools
          sudo modprobe dm_thin_pool
          truncate -s 2G "$RUNNER_TEMP/opltest.img"
          LOOP=$(sudo losetup --find --show "$RUNNER_TEMP/opltest.img")
          sudo pvcreate -y "$LOOP"
          sudo vgcreate opltest "$LOOP"
          sudo lvcreate -y -T -L 1G opltest/tp
          sudo lvs opltest
      # ZFS 풀 시험이 zvol을 만들 데이터셋 `opltestz/opl`. zpool은 파일 하나 위에 둔다.
      - name: ZFS pool on a file
        run: |
          sudo apt-get update
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs
          sudo udevadm control --reload-rules
          truncate -s 2G "$RUNNER_TEMP/opltestz.img"
          sudo zpool create opltestz "$RUNNER_TEMP/opltestz.img"
          sudo zfs create opltestz/opl
          sudo zfs list -r opltestz
          zfs version
          sudo zpool status opltestz
      # RBD 풀 시험이 이미지를 만들 Ceph 풀 `rbd`. microceph로 노드 하나짜리 Ceph(루프 파일 OSD 하나,
      # 복제 1)를 띄운다. ceph-common의 rbd·ceph와 QEMU(qemu-block-extra의 librbd)가 Ceph 기본 위치에서
      # 읽도록 microceph의 ceph.conf와 키링을 /etc/ceph에 둔다. 제한된 사용자 시험을 위해 네임스페이스
      # `rbd/opl`과 사용자 `client.opltest`(caps `profile rbd`)를 만들고, 그 키링은 Ceph 기본 위치가 아닌
      # /etc/opl-ceph에 두어 그곳의 ceph.conf로만 찾게 한다.
      - name: Ceph (microceph) with an rbd pool
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y ceph-common qemu-block-extra jq
          sudo snap install microceph --channel squid/stable
          sudo snap refresh --hold microceph
          # microceph의 별칭(/snap/bin/rbd·ceph 등)은 snap에 갇힌 클라이언트라 /etc/opl-ceph와 시험의
          # /tmp(snap 전용 /tmp)를 보지 못한다. 시험은 `sudo -E env "PATH=$PATH"`로 돌고 러너의 PATH는
          # /snap/bin이 /usr/bin보다 앞이므로 별칭을 없애 ceph-common의 명령을 쓰게 한다.
          snap aliases microceph
          if snap aliases microceph | grep -q '^microceph\.'; then sudo snap unalias microceph; fi
          sudo env "PATH=$PATH" sh -c 'echo "PATH=$PATH"; command -v rbd ceph qemu-img qemu-io'
          test "$(sudo env "PATH=$PATH" sh -c 'command -v rbd')" = /usr/bin/rbd
          test "$(sudo env "PATH=$PATH" sh -c 'command -v ceph')" = /usr/bin/ceph
          sudo microceph cluster bootstrap
          sudo mkdir -p /etc/ceph
          sudo ln -sf /var/snap/microceph/current/conf/ceph.conf /etc/ceph/ceph.conf
          sudo ls -l /var/snap/microceph/current/conf
          sudo sh -c 'ln -sf /var/snap/microceph/current/conf/*.keyring /etc/ceph/'
          ls -l /etc/ceph
          trap 'sudo ceph -s || true' EXIT
          # 조건이 맞을 때까지 5초마다, 최대 10분 기다린다.
          wait_for() {
            for _ in $(seq 120); do
              if "$@"; then return 0; fi
              sleep 5
            done
            return 1
          }
          sudo ceph config set global mon_allow_pool_size_one true
          sudo ceph config set global osd_pool_default_size 1
          sudo microceph disk add loop,4G,1
          wait_for sh -c 'sudo ceph osd stat | grep -q " 1 up"'
          sudo ceph osd pool create rbd 32
          sudo ceph osd pool set rbd size 1 --yes-i-really-mean-it
          sudo ceph osd pool set .mgr size 1 --yes-i-really-mean-it || true
          wait_for sh -c "sudo ceph status --format json | jq -e '.pgmap.num_pgs > 0 and ([.pgmap.pgs_by_state[] | select(.state_name | startswith(\"active\")) | .count] | add) == .pgmap.num_pgs'"
          sudo rbd pool init rbd
          sudo rbd create --size 1 rbd/opl-ci-probe
          sudo rbd rm --no-progress rbd/opl-ci-probe
          sudo ceph df
          sudo rbd namespace create rbd/opl
          sudo mkdir -p /etc/opl-ceph
          sudo ceph auth get-or-create client.opltest mon 'profile rbd' osd 'profile rbd pool=rbd' mgr 'profile rbd pool=rbd' \
            | sudo tee /etc/opl-ceph/opltest.keyring >/dev/null
          { sudo cat /etc/ceph/ceph.conf; printf '\n[client.opltest]\nkeyring = /etc/opl-ceph/opltest.keyring\n'; } \
            | sudo tee /etc/opl-ceph/ceph.conf >/dev/null
          sudo rbd --id opltest --conf /etc/opl-ceph/ceph.conf ls --pool rbd --namespace opl
          sudo ceph --id opltest --conf /etc/opl-ceph/ceph.conf df detail >/dev/null
      # 공유 LVM 풀 시험이 LV를 만들 공유 VG `oplshared`. targetcli(LIO)로 파일 백스토어 LUN 하나를
      # 내보내는 루프백 iSCSI 타깃(데모 모드 ACL, 인증 없음)을 만들어 open-iscsi로 로그인하고,
      # lvmlockd와 sanlock(softdog 감시, host_id 1)으로 그 LUN 위에 공유 VG를 만든다. lvmlockd는 호스트
      # 전체에 켜지지만 로컬 VG(LVM-thin 시험)는 그대로 쓴다. E2E는 잠금을 멈추고 로그아웃한 뒤 opld가
      # 다시 로그인하고 잠금을 시작하게 한다.
      - name: iSCSI target and a shared (lvmlockd) VG
        timeout-minutes: 10
        env:
          IQN: iqn.2003-01.org.linux-iscsi.opl:shared
        run: |
          sudo apt-get update
          sudo apt-get install -y targetcli-fb open-iscsi lvm2-lockd sanlock
          sudo modprobe target_core_mod
          sudo modprobe iscsi_target_mod
          sudo systemctl start iscsid
          truncate -s 2G "$RUNNER_TEMP/oplshared.img"
          sudo targetcli /backstores/fileio create oplshared "$RUNNER_TEMP/oplshared.img"
          sudo targetcli /iscsi create "$IQN"
          sudo targetcli "/iscsi/$IQN/tpg1/luns" create /backstores/fileio/oplshared
          sudo targetcli "/iscsi/$IQN/tpg1" set attribute authentication=0 demo_mode_write_protect=0 generate_node_acls=1 cache_dynamic_acls=1
          sudo targetcli ls
          sudo iscsiadm -m discovery -t sendtargets -p 127.0.0.1
          sudo iscsiadm -m node -T "$IQN" -p 127.0.0.1 --login
          sudo udevadm settle
          sudo iscsiadm -m session
          DEV="/dev/disk/by-path/ip-127.0.0.1:3260-iscsi-$IQN-lun-0"
          ls -l "$DEV"
          sudo modprobe softdog
          sudo sed -i 's/^\s*#\?\s*use_lvmlockd = .*/\tuse_lvmlockd = 1/' /etc/lvm/lvm.conf
          printf 'local {\n\thost_id = 1\n}\n' | sudo tee /etc/lvm/lvmlocal.conf
          sudo lvmconfig global/use_lvmlockd local/host_id
          sudo systemctl start wdmd sanlock lvmlockd
          sudo vgcreate --shared oplshared "$DEV"
          sudo vgchange --lockstart oplshared
          sudo vgs -o vg_name,vg_lock_type,vg_size,vg_free oplshared
          sudo lvs opltest
      # root로 빌드하므로 캐시하지 않고 임시 디렉터리에 빌드한다.
      - name: QEMU, bridge and E2E tests as root
        run: |
          sudo -E env "PATH=$PATH" OPL_TEST_SYSTEMD=1 CARGO_TARGET_DIR="$RUNNER_TEMP/target" \
            cargo test --features "$FEATURES" -p opl-qemu -p opl-driver -p opl-reconciler -p opld
        env:
          FEATURES: opl-qemu/qemu-it,opl-driver/qemu-it,opl-driver/net-it,opl-reconciler/qemu-it,opld/qemu-it,opld/net-it,opld/web-it,opld/nfs-it,opl-driver/lvm-it,opld/lvm-it,opl-driver/zfs-it,opld/zfs-it,opl-driver/rbd-it,opld/rbd-it,opl-driver/lvm-shared-it,opld/lvm-shared-it,opld/migration-it
          OPL_TEST_NFS_EXPORT: /srv/opl-nfs
          OPL_TEST_LVM: opltest/tp
          OPL_TEST_ZFS: opltestz/opl
          OPL_TEST_RBD: rbd
          OPL_TEST_RBD_USER: opltest
          OPL_TEST_RBD_NAMESPACE: opl
          OPL_TEST_RBD_CONF: /etc/opl-ceph/ceph.conf
          OPL_TEST_LVM_SHARED: oplshared
          OPL_TEST_ISCSI: 127.0.0.1,iqn.2003-01.org.linux-iscsi.opl:shared

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
