name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: OpenSSL headers (Linux; native-tls)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      # 시험 빌드에만 있는 고리로 리더의 api 실행기를 막는 굶김 시험(QEMU 없음)
      - run: cargo test -p opld --features starve-it --test starve
      # 노드 100개(투표 5, 대기 learner 2, 나머지 관찰 노드)를 한 프로세스에 띄워 리더 RPC(확인 묶기 비율 포함)·쓰기
      # p99·관찰 노드 뒤처짐·노드 추가·투표 멤버와 리더 장애를 잰다(설계 §5·§6·§14·§15, 개발 Mac에서 16초쯤)
      - name: Scale test (100 nodes in one process)
        run: cargo test -p opl-cluster --features scale-it --test scale -- --nocapture
        timeout-minutes: 10
        env:
          OPL_SCALE_NODES: 100
          # 코어 3~4개 러너에서 노드 100개의 쓰기가 CPU에 묶여 흔들린다. 쓰기 p99 기준만 늦춘다(README, 설계 §14).
          OPL_SCALE_P99_MS: 200
      - name: Storage integration tests (qemu-img)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils
          cargo test -p opl-driver --features storage-it --test dir_storage
          cargo test -p opl-api --features storage-it --test volumes
          cargo test -p opl-api --features storage-it --test backup_tasks --test backup_job_runs --test vm_import_tasks

  # 웹 UI: 타입 검사, 린트, 단위 테스트, API 타입이 Rust 정의와 같은지, 알려진 취약점, 빌드
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: OpenSSL headers (native-tls)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: API types match the Rust API
        run: |
          pnpm gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: pnpm audit --prod
      - run: pnpm build

  # 패키징 셸 스크립트: shellcheck, build-deb.sh 버전 확인·키링 시험, build-repo.sh 시험(가짜 apt-ftparchive·gpg),
  # maintainer 스크립트 시험(가짜 systemctl), 옛 제품 이름(oplite)이 허용 목록 밖에 남지 않았는지(name-test.sh)
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shopt -s globstar
          shellcheck packaging/**/*.sh packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm .github/scripts/*.sh
      - run: bash packaging/tests/name-test.sh
      - run: bash packaging/tests/build-deb-test.sh
      - run: bash packaging/tests/build-repo-test.sh
      - run: bash packaging/tests/portal-test.sh
      - run: bash packaging/tests/maint-test.sh
      - run: bash packaging/tests/setup-test.sh
      # 설치 프로그램 환경(busybox sh·awk)에서 orbivisor-setup.sh 함수가 같은 결과를 내는지
      - name: setup-test with busybox
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox
          OPL_SH="busybox sh" OPL_AWK="busybox awk" bash packaging/tests/setup-test.sh
      - run: bash packaging/tests/iso-test.sh

  # Debian 패키지 orbivisor와 전환 패키지 oplite: 웹 UI를 넣은 릴리스 빌드 → build-deb.sh(.github/actions/build-deb) →
  # Debian 13 컨테이너에서 설치 시험, build-repo.sh로 만든 APT 저장소에서 옛 oplite를 설치하고 testing 채널의
  # orbivisor로 넘어가는 시험
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-deb
        id: build
      - name: Package info and contents
        env:
          DEB: ${{ steps.build.outputs.deb }}
          TRANS_DEB: ${{ steps.build.outputs.transitional }}
        run: |
          for deb in "$DEB" "$TRANS_DEB"; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
      - name: Install test in Debian 13
        env:
          DEB: ${{ steps.build.outputs.deb }}
          TRANS_DEB: ${{ steps.build.outputs.transitional }}
        run: |
          docker run --rm -v "$PWD:/work" debian:13 \
            bash /work/packaging/tests/deb-test.sh "/work/$DEB" "/work/$TRANS_DEB"
      - name: APT repository test in Debian 13
        env:
          DEB: ${{ steps.build.outputs.deb }}
          TRANS_DEB: ${{ steps.build.outputs.transitional }}
        run: |
          docker run --rm -v "$PWD:/work" debian:13 \
            bash /work/packaging/tests/repo-test.sh "/work/$DEB" "/work/$TRANS_DEB"
      # 빌드 버전 시험을 OPL_VERSION을 준 빌드로 다시 돌린다(clap 기본 version으로 되돌리면 실패한다).
      - name: Version tests with OPL_VERSION
        run: OPL_VERSION=9.9.9~t cargo test -p opl-types -p opld -p oplctl --lib --test version
      - uses: actions/upload-artifact@v4
        with:
          name: orbivisor-deb
          path: dist/*_amd64.deb

  # M7: 실제 KVM으로 VM을 띄우고 NIC를 브리지에 잇는다. tap과 브리지를 만들려면 root가 필요하고,
  # QEMU는 systemd 스코프로 감싼다(OPL_TEST_SYSTEMD). 웹 UI E2E는 브라우저로 같은 opld를 다룬다.
  # 라이브 마이그레이션 E2E는 한 호스트의 opld 둘로 공유 디렉터리·NFS·RBD·공유 LVM 풀 위의 VM을 옮긴다
  # (두 노드의 스코프 이름이 겹치므로 그 시험만 스코프를 끈다).
  linux-kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    # root로 도는 테스트도 runner가 설치한 브라우저를 쓴다.
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: KVM, QEMU, UEFI firmware, iproute2, nftables
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config qemu-system-x86 ovmf qemu-utils iproute2 nftables
          ls -l /dev/kvm
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web UI and browser
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build
          pnpm -C web exec playwright install --with-deps chromium
      # NFS 풀 E2E가 마운트할 내보내기. root로 마운트한 opld가 쓰도록 root를 그대로 둔다.
      - name: NFS server exporting a test directory
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-kernel-server
          sudo mkdir -p /srv/opl-nfs
          echo '/srv/opl-nfs 127.0.0.1(rw,sync,no_subtree_check,no_root_squash)' | sudo tee -a /etc/exports
          sudo systemctl restart nfs-kernel-server
          sudo exportfs -v
      # LVM-thin 풀 시험이 LV를 만들 VG `opltest`와 thin pool `tp`. 루프 장치 위에 둔다.
      - name: LVM thin pool on a loop device
        run: |
          sudo apt-get update
          sudo apt-get install -y lvm2 thin-provisioning-tools
          sudo modprobe dm_thin_pool
          truncate -s 2G "$RUNNER_TEMP/opltest.img"
          LOOP=$(sudo losetup --find --show "$RUNNER_TEMP/opltest.img")
          sudo pvcreate -y "$LOOP"
          sudo vgcreate opltest "$LOOP"
          sudo lvcreate -y -T -L 1G opltest/tp
          sudo lvs opltest
      # ZFS 풀 시험이 zvol을 만들 데이터셋 `opltestz/opl`. zpool은 파일 하나 위에 둔다.
      - name: ZFS pool on a file
        run: |
          sudo apt-get update
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs
          sudo udevadm control --reload-rules
          truncate -s 2G "$RUNNER_TEMP/opltestz.img"
          sudo zpool create opltestz "$RUNNER_TEMP/opltestz.img"
          sudo zfs create opltestz/opl
          sudo zfs list -r opltestz
          zfs version
          sudo zpool status opltestz
      # RBD 풀 시험이 이미지를 만들 Ceph 풀 `rbd`. Ubuntu apt 패키지(ceph 19.2)로 노드 하나짜리 Ceph(모니터·
      # 매니저 하나, 4G 성긴 파일 위 BlueStore OSD 하나, 복제 1)를 손으로 띄운다(snap 스토어가 러너에서
      # 닿지 않을 때가 있어 microceph를 쓰지 않는다). ceph-common의 rbd·ceph와 QEMU(qemu-block-extra의
      # librbd)가 읽도록 ceph.conf와 관리자 키링을 Ceph 기본 위치 /etc/ceph에 둔다. 제한된 사용자 시험을
      # 위해 네임스페이스 `rbd/opl`과 사용자 `client.opltest`(caps `profile rbd`)를 만들고, 그 키링은 Ceph
      # 기본 위치가 아닌 /etc/opl-ceph에 두어 그곳의 ceph.conf로만 찾게 한다.
      - name: Ceph (apt, single node) with an rbd pool
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y ceph-mon ceph-mgr ceph-osd ceph-common qemu-block-extra jq uuid-runtime
          # 모니터·매니저·OSD를 모두 이 호스트의 127.0.0.1에 묶는다. 복제 1을 허용하고 CRUSH 장애 도메인을
          # OSD로 둔다(호스트가 하나뿐이다).
          FSID=$(uuidgen)
          HOST=$(hostname -s)
          sudo mkdir -p /etc/ceph
          sudo tee /etc/ceph/ceph.conf >/dev/null <<CONF
          [global]
          fsid = $FSID
          mon_initial_members = $HOST
          mon_host = [v2:127.0.0.1:3300,v1:127.0.0.1:6789]
          public_addr = 127.0.0.1
          cluster_addr = 127.0.0.1
          auth_cluster_required = cephx
          auth_service_required = cephx
          auth_client_required = cephx
          osd_pool_default_size = 1
          osd_pool_default_min_size = 1
          mon_allow_pool_size_one = true
          osd_crush_chooseleaf_type = 0
          mon_warn_on_insecure_global_id_reclaim_allowed = false
          CONF
          # 모니터: 키링(mon., client.admin)과 monmap을 만들어 저장소를 초기화한다.
          sudo ceph-authtool --create-keyring /etc/ceph/ceph.client.admin.keyring --gen-key -n client.admin \
            --cap mon 'allow *' --cap osd 'allow *' --cap mds 'allow *' --cap mgr 'allow *'
          sudo ceph-authtool --create-keyring /var/lib/ceph/tmp/ceph.mon.keyring --gen-key -n mon. --cap mon 'allow *'
          sudo ceph-authtool /var/lib/ceph/tmp/ceph.mon.keyring --import-keyring /etc/ceph/ceph.client.admin.keyring
          sudo monmaptool --create --addv "$HOST" '[v2:127.0.0.1:3300,v1:127.0.0.1:6789]' --fsid "$FSID" /var/lib/ceph/tmp/monmap
          sudo chown ceph:ceph /var/lib/ceph/tmp/ceph.mon.keyring /var/lib/ceph/tmp/monmap
          sudo -u ceph mkdir -p "/var/lib/ceph/mon/ceph-$HOST"
          sudo -u ceph ceph-mon --mkfs -i "$HOST" --monmap /var/lib/ceph/tmp/monmap --keyring /var/lib/ceph/tmp/ceph.mon.keyring
          sudo rm -f /var/lib/ceph/tmp/ceph.mon.keyring /var/lib/ceph/tmp/monmap
          sudo systemctl start "ceph-mon@$HOST"
          trap 'sudo ceph -s || true' EXIT
          # 조건이 맞을 때까지 5초마다, 최대 10분 기다린다.
          wait_for() {
            for _ in $(seq 120); do
              if "$@"; then return 0; fi
              sleep 5
            done
            return 1
          }
          wait_for sudo timeout 10 ceph mon stat
          # 매니저(PG 상태와 `ceph df`가 매니저를 거친다).
          sudo -u ceph mkdir -p "/var/lib/ceph/mgr/ceph-$HOST"
          sudo ceph auth get-or-create "mgr.$HOST" mon 'allow profile mgr' osd 'allow *' mds 'allow *' \
            | sudo -u ceph tee "/var/lib/ceph/mgr/ceph-$HOST/keyring" >/dev/null
          sudo systemctl start "ceph-mgr@$HOST"
          # OSD 하나: 블록 장치 대신 4G 성긴 파일 위의 BlueStore.
          OSD_UUID=$(uuidgen)
          OSD_ID=$(sudo ceph osd new "$OSD_UUID")
          sudo -u ceph mkdir -p "/var/lib/ceph/osd/ceph-$OSD_ID"
          sudo ceph auth get-or-create "osd.$OSD_ID" mon 'allow profile osd' mgr 'allow profile osd' osd 'allow *' \
            | sudo -u ceph tee "/var/lib/ceph/osd/ceph-$OSD_ID/keyring" >/dev/null
          sudo -u ceph truncate -s 4G "/var/lib/ceph/osd/ceph-$OSD_ID/block"
          sudo -u ceph ceph-osd -i "$OSD_ID" --mkfs --osd-uuid "$OSD_UUID" --osd-objectstore bluestore
          sudo systemctl start "ceph-osd@$OSD_ID"
          wait_for sh -c 'sudo ceph osd stat | grep -q " 1 up"'
          wait_for sh -c 'sudo ceph mgr stat --format json | jq -e .available'
          sudo ceph osd pool create rbd 32
          sudo ceph osd pool set rbd size 1 --yes-i-really-mean-it
          sudo ceph osd pool set .mgr size 1 --yes-i-really-mean-it || true
          wait_for sh -c "sudo ceph status --format json | jq -e '.pgmap.num_pgs > 0 and ([.pgmap.pgs_by_state[] | select(.state_name | startswith(\"active\")) | .count] | add) == .pgmap.num_pgs'"
          sudo rbd pool init rbd
          sudo rbd create --size 1 rbd/opl-ci-probe
          sudo rbd rm --no-progress rbd/opl-ci-probe
          sudo ceph df
          sudo rbd namespace create rbd/opl
          sudo mkdir -p /etc/opl-ceph
          sudo ceph auth get-or-create client.opltest mon 'profile rbd' osd 'profile rbd pool=rbd' mgr 'profile rbd pool=rbd' \
            | sudo tee /etc/opl-ceph/opltest.keyring >/dev/null
          { sudo cat /etc/ceph/ceph.conf; printf '\n[client.opltest]\nkeyring = /etc/opl-ceph/opltest.keyring\n'; } \
            | sudo tee /etc/opl-ceph/ceph.conf >/dev/null
          sudo rbd --id opltest --conf /etc/opl-ceph/ceph.conf ls --pool rbd --namespace opl
          sudo ceph --id opltest --conf /etc/opl-ceph/ceph.conf df detail >/dev/null
      # 공유 LVM 풀 시험이 LV를 만들 공유 VG `oplshared`. targetcli(LIO)로 파일 백스토어 LUN 하나를
      # 내보내는 루프백 iSCSI 타깃(데모 모드 ACL, 인증 없음)을 만들어 open-iscsi로 로그인하고,
      # lvmlockd와 sanlock(softdog 감시, host_id 1)으로 그 LUN 위에 공유 VG를 만든다. lvmlockd는 호스트
      # 전체에 켜지지만 로컬 VG(LVM-thin 시험)는 그대로 쓴다. E2E는 잠금을 멈추고 로그아웃한 뒤 opld가
      # 다시 로그인하고 잠금을 시작하게 한다.
      - name: iSCSI target and a shared (lvmlockd) VG
        timeout-minutes: 10
        env:
          IQN: iqn.2003-01.org.linux-iscsi.opl:shared
        run: |
          sudo apt-get update
          sudo apt-get install -y targetcli-fb open-iscsi lvm2-lockd sanlock
          sudo modprobe target_core_mod
          sudo modprobe iscsi_target_mod
          sudo systemctl start iscsid
          truncate -s 2G "$RUNNER_TEMP/oplshared.img"
          sudo targetcli /backstores/fileio create oplshared "$RUNNER_TEMP/oplshared.img"
          sudo targetcli /iscsi create "$IQN"
          sudo targetcli "/iscsi/$IQN/tpg1/luns" create /backstores/fileio/oplshared
          sudo targetcli "/iscsi/$IQN/tpg1" set attribute authentication=0 demo_mode_write_protect=0 generate_node_acls=1 cache_dynamic_acls=1
          sudo targetcli ls
          sudo iscsiadm -m discovery -t sendtargets -p 127.0.0.1
          sudo iscsiadm -m node -T "$IQN" -p 127.0.0.1 --login
          sudo udevadm settle
          sudo iscsiadm -m session
          DEV="/dev/disk/by-path/ip-127.0.0.1:3260-iscsi-$IQN-lun-0"
          # udev가 by-path 링크를 settle 뒤에 조금 늦게 만들 때가 있다.
          for _ in $(seq 30); do [ -e "$DEV" ] && break; sleep 1; done
          ls -l "$DEV"
          sudo modprobe softdog
          sudo sed -i 's/^\s*#\?\s*use_lvmlockd = .*/\tuse_lvmlockd = 1/' /etc/lvm/lvm.conf
          printf 'local {\n\thost_id = 1\n}\n' | sudo tee /etc/lvm/lvmlocal.conf
          sudo lvmconfig global/use_lvmlockd local/host_id
          sudo systemctl start wdmd sanlock lvmlockd
          sudo vgcreate --shared oplshared "$DEV"
          sudo vgchange --lockstart oplshared
          sudo vgs -o vg_name,vg_lock_type,vg_size,vg_free oplshared
          sudo lvs opltest
      # root로 빌드하므로 캐시하지 않고 임시 디렉터리에 빌드한다.
      - name: QEMU, bridge and E2E tests as root
        run: |
          sudo -E env "PATH=$PATH" OPL_TEST_SYSTEMD=1 CARGO_TARGET_DIR="$RUNNER_TEMP/target" \
            cargo test --features "$FEATURES" -p opl-qemu -p opl-driver -p opl-reconciler -p opld
        env:
          FEATURES: opl-qemu/qemu-it,opl-driver/qemu-it,opl-driver/net-it,opl-reconciler/qemu-it,opld/qemu-it,opld/net-it,opld/web-it,opld/nfs-it,opl-driver/lvm-it,opld/lvm-it,opl-driver/zfs-it,opld/zfs-it,opl-driver/rbd-it,opld/rbd-it,opl-driver/lvm-shared-it,opld/lvm-shared-it,opld/migration-it,opld/ha-it
          OPL_TEST_NFS_EXPORT: /srv/opl-nfs
          OPL_TEST_LVM: opltest/tp
          OPL_TEST_ZFS: opltestz/opl
          OPL_TEST_RBD: rbd
          OPL_TEST_RBD_USER: opltest
          OPL_TEST_RBD_NAMESPACE: opl
          OPL_TEST_RBD_CONF: /etc/opl-ceph/ceph.conf
          OPL_TEST_LVM_SHARED: oplshared
          OPL_TEST_ISCSI: 127.0.0.1,iqn.2003-01.org.linux-iscsi.opl:shared

  # LDAP 영역: 실제 OpenLDAP(slapd)에 LDAPS와 ldap://+StartTLS로 사용자 찾기·바인드, memberOf 그룹,
  # API의 영역 시험 동작과 외부 사용자 로그인. 디렉터리(시험 CA, 사용자 둘, 그룹 하나)는
  # ldap-setup.sh가 아래 OPL_TEST_LDAP_* 값으로 만든다.
  ldap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPL_TEST_LDAP_URL: "ldaps://127.0.0.1:636"
      OPL_TEST_LDAP_STARTTLS_URL: "ldap://127.0.0.1:389"
      OPL_TEST_LDAP_CA: /tmp/opl-test-ldap-ca.pem
      OPL_TEST_LDAP_BASE_DN: "dc=example,dc=com"
      OPL_TEST_LDAP_BIND_DN: "cn=admin,dc=example,dc=com"
      OPL_TEST_LDAP_BIND_PASSWORD: opl-admin-pw
      OPL_TEST_LDAP_USER: alice
      OPL_TEST_LDAP_USER_PASSWORD: alice-pw
      OPL_TEST_LDAP_OTHER_USER: bob
      OPL_TEST_LDAP_OTHER_PASSWORD: bob-pw
      OPL_TEST_LDAP_GROUP: "cn=admins,ou=groups,dc=example,dc=com"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: OpenSSL headers (native-tls)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: slapd with LDAPS, StartTLS, two users and a group
        run: sudo -E sh .github/scripts/ldap-setup.sh
      - run: cargo test -p opl-api --features ldap-it --test ldap_it
      - name: slapd log
        if: failure()
        run: sudo journalctl -u slapd --no-pager -n 200

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
