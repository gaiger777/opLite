# Debian 패키지 orbivisor(와 전환 패키지 oplite) 만들기: 웹 UI → 릴리스 빌드(opld web-ui, oplctl 크레이트 —
# 바이너리 orbivisord, orbivisorctl) → build-deb.sh.
# ci.yml package 작업과 iso.yml이 같이 쓴다. 저장소를 checkout한 뒤 부른다.
# 패키지 버전 = 워크스페이스 버전~ci<run 번호>. 바이너리의 --version도 이 값이고, 환경 변수 OPL_VERSION으로 남긴다.
name: Build orbivisor deb
description: Build the web UI, release binaries and the orbivisor Debian package with the transitional oplite package
outputs:
  deb:
    description: Path of the built package (dist/orbivisor_<version>_amd64.deb)
    value: ${{ steps.deb.outputs.path }}
  transitional:
    description: Path of the transitional package (dist/oplite_<version>_amd64.deb)
    value: ${{ steps.deb.outputs.transitional }}
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: web/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: OpenSSL headers (native-tls)
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev pkg-config
    - name: Web UI
      shell: bash
      run: |
        pnpm -C web install --frozen-lockfile
        pnpm -C web build
    - name: Package version
      shell: bash
      run: |
        WS_VERSION=$(grep '^version' Cargo.toml | head -n1 | cut -d'"' -f2)
        echo "OPL_VERSION=${WS_VERSION}~ci${{ github.run_number }}" >> "$GITHUB_ENV"
    - shell: bash
      run: cargo build --release -p opld --features web-ui -p oplctl
    # CI 패키지는 저장소의 개발 구독 키를 믿는 개발 패키지다(정식 빌드는 OPL_LICENSE_KEYS를 준다).
    - id: deb
      shell: bash
      env:
        OPL_DEV_LICENSE: "1"
      run: |
        packaging/deb/build-deb.sh "$OPL_VERSION" dist
        echo "path=dist/orbivisor_${OPL_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
        echo "transitional=dist/oplite_${OPL_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
