# 파일 복원 도우미 이미지(packaging/restore-image/build.sh)가 쓰는 Debian 13(trixie) deb. 셸 KEY=value로 build.sh가 읽는다.
# DEBS_<arch>: 한 줄에 deb 하나 `NAME VERSION URL SHA256`. URL은 snapshot.debian.org(사라지지 않음), 해시는 그 시각
# trixie main의 Packages 색인에서 옮겼다(2026-11-24, Debian 13.8). 의존성은 풀지 않고 손으로 적는다 — build.sh가
# blkid·lvm의 ELF NEEDED를 따라 빠진 라이브러리를 찾으면 이름을 알리고 실패한다.
# 커널을 올릴 때: 두 아키텍처의 linux-image 줄을 같은 판으로 바꾸고(커널 판은 deb의 /boot/vmlinuz-<판>에서 읽음),
# 이미지를 다시 빌드해 설계 문서 §18의 커널 설정 탐침이 그대로인지 본다(build.sh가 설정을 찍고 모자라면 실패).
# 이 파일의 SHA-256 앞 12자가 이미지 판(`orbivisor <판> lock-…`)에 들어간다.
