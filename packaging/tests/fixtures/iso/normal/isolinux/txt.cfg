label orbivisor
	menu label ^Install Orbivisor
	menu default
	kernel /install.amd/vmlinuz
	append vga=788 initrd=/install.amd/initrd.gz auto=true priority=high preseed/file=/cdrom/preseed/orbivisor.cfg --- quiet
label install
	menu label ^Install
	kernel /install.amd/vmlinuz
	append vga=788 initrd=/install.amd/initrd.gz --- quiet 
