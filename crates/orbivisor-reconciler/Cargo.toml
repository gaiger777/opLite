[package]
name = "orbivisor-reconciler"
description = "Reconciliation loop that drives VMs on a node toward their desired state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# 실제 QEMU로 orbivisord 재시작 후 재연결을 확인하는 테스트. macOS는 brew install qemu, Linux는 apt install qemu-system ovmf qemu-efi-aarch64 qemu-utils가 필요하다(KVM이 없으면 TCG).
qemu-it = []

[dependencies]
async-trait.workspace = true
hex.workspace = true
orbivisor-cluster.workspace = true
orbivisor-driver.workspace = true
orbivisor-types.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
openraft.workspace = true
orbivisor-qemu.workspace = true
redb.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
