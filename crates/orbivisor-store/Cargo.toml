[package]
name = "orbivisor-store"
description = "Deduplicating backup chunk store for Orbivisor (format, encryption, local and S3 backends, GC, verify)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# 시험용 가짜 S3 서버(axum). orbivisor-api·orbivisord 시험이 켠다.
fake-s3 = ["dep:axum"]
# 시험 도움(디스크 이미지를 저장소 백업으로 쓰기). orbivisor-driver·orbivisord 시험이 켠다.
test-util = []
# qemu-img·qemu-io·qemu-nbd로 NBD 클라이언트·서버가 QEMU와 맞는지 보는 시험(macOS: brew install qemu,
# Debian/Ubuntu: apt install qemu-utils).
storage-it = ["test-util"]

[dependencies]
argon2.workspace = true
async-trait.workspace = true
axum = { workspace = true, optional = true }
base64.workspace = true
bytes.workspace = true
data-encoding.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
lz4_flex.workspace = true
orbivisor-types.workspace = true
ring.workspace = true
roxmltree.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
proptest.workspace = true
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
