[package]
name = "opl-driver"
description = "Hypervisor and storage drivers for opLite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# qemu-img만 있으면 되는 스토리지 통합 테스트 (macOS: brew install qemu, Debian/Ubuntu: apt install qemu-utils)
storage-it = []
# 실제 VM을 띄우는 통합 테스트. macOS는 brew install qemu, Linux는 apt install qemu-system ovmf qemu-efi-aarch64 qemu-utils가 필요하다(KVM이 없으면 TCG).
qemu-it = []
# 실제 tap과 브리지를 만드는 통합 테스트. Linux에서 root(CAP_NET_ADMIN)와 iproute2가 필요하다.
net-it = []
# 실제 LVM-thin 풀의 통합 테스트. Linux에서 root, lvm2, qemu-img, qemu-io와 테스트가 LV를 만들고 지워도
# 되는 VG/thin pool(`OPL_TEST_LVM=VG/THINPOOL`)이 필요하다.
lvm-it = []
# 실제 ZFS 풀의 통합 테스트. Linux에서 root, zfsutils-linux, qemu-img, qemu-io와 테스트가 zvol을 만들고
# 지워도 되는 데이터셋(`OPL_TEST_ZFS=POOL/DATASET`)이 필요하다.
zfs-it = []
# 실제 Ceph RBD 풀의 통합 테스트. Linux에서 root, ceph-common, qemu-block-extra, qemu-img, qemu-io,
# `client.admin`으로 접속할 수 있는 ceph.conf·키링과 테스트가 이미지를 만들고 지워도 되는 Ceph 풀
# (`OPL_TEST_RBD=POOL`)이 필요하다. 제한된 사용자 시험은 `OPL_TEST_RBD_USER`·`OPL_TEST_RBD_NAMESPACE`·
# `OPL_TEST_RBD_CONF`가 있을 때만 돈다.
rbd-it = []
# 실제 공유 LVM 풀(lvmlockd 공유 VG)의 통합 테스트. Linux에서 root, lvm2-lockd와 sanlock(또는 dlm),
# qemu-img, qemu-io와 잠금을 시작한 공유 VG(`OPL_TEST_LVM_SHARED=VG`, 테스트가 LV를 만들고 지워도 된다)가
# 필요하다.
lvm-shared-it = []

[dependencies]
async-trait.workspace = true
fs4.workspace = true
opl-qemu.workspace = true
opl-types.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
