[package]
name = "opld"
description = "Orbivisor node daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# 크레이트 이름(-p opld)은 두고 설치하는 바이너리 이름만 제품 이름으로 한다(옛 이름 opld는 패키지의 링크).
autobins = false

[[bin]]
name = "orbivisord"
path = "src/main.rs"

[features]
# 실제 QEMU로 CLI부터 콘솔, kill -9 뒤 재연결까지 확인하는 E2E 테스트.
# macOS는 brew install qemu, Linux는 apt install qemu-system ovmf qemu-efi-aarch64 qemu-utils가 필요하다.
qemu-it = []
# VM NIC를 Linux 브리지에 잇는 E2E 테스트(qemu-it와 함께). Linux에서 root와 iproute2가 필요하다(방화벽
# E2E는 nftables도).
net-it = []
# 웹 UI(web/dist)를 바이너리에 넣는다. 먼저 `pnpm -C web build`로 만든다. 디버그 빌드는 없어도 되고
# 안내 페이지를 준다.
web-ui = []
# 실제 NFS 풀을 마운트하는 E2E 테스트. Linux에서 root, NFS 클라이언트(nfs-common), qemu-img와
# 127.0.0.1에 내보낸 디렉터리(`OPL_TEST_NFS_EXPORT`)가 필요하다.
nfs-it = []
# 실제 LVM-thin 풀의 볼륨으로 VM을 띄우는 E2E 테스트. qemu-it의 준비물에 더해 Linux에서 root, lvm2,
# qemu-io와 테스트가 LV를 만들고 지워도 되는 VG/thin pool(`OPL_TEST_LVM=VG/THINPOOL`)이 필요하다.
lvm-it = []
# 실제 ZFS 풀의 볼륨(zvol)으로 VM을 띄우는 E2E 테스트. qemu-it의 준비물에 더해 Linux에서 root,
# zfsutils-linux, qemu-io와 테스트가 zvol을 만들고 지워도 되는 데이터셋(`OPL_TEST_ZFS=POOL/DATASET`)이 필요하다.
zfs-it = []
# 실제 Ceph RBD 풀의 볼륨(RBD 이미지)으로 VM을 띄우는 E2E 테스트. qemu-it의 준비물에 더해 Linux에서 root,
# ceph-common, qemu-block-extra, qemu-io, `client.admin`으로 접속할 수 있는 ceph.conf·키링과 테스트가
# 이미지를 만들고 지워도 되는 Ceph 풀(`OPL_TEST_RBD=POOL`)이 필요하다.
rbd-it = []
# 실제 공유 LVM 풀(lvmlockd 공유 VG)의 볼륨으로 VM을 띄우는 E2E 테스트. qemu-it의 준비물에 더해 Linux에서
# root, lvm2-lockd와 sanlock(또는 dlm), qemu-io와 테스트가 LV를 만들고 지워도 되는 공유 VG
# (`OPL_TEST_LVM_SHARED=VG`)가 필요하다. `OPL_TEST_ISCSI=PORTAL,TARGET`이 있으면 VG가 그 iSCSI 타깃의
# LUN 위에 있다고 보고, 시험 전에 잠금을 멈추고 로그아웃해 opld가 다시 로그인하게 한다.
lvm-shared-it = []
# 브라우저(Playwright)로 웹 UI를 확인하는 E2E. qemu-it의 준비물에 더해 pnpm과
# `pnpm -C web exec playwright install chromium`, 빌드한 web/dist가 필요하다.
web-it = ["qemu-it", "web-ui"]
# Orbivisor가 Ceph를 설치·구성하는 E2E(계획 56): Ceph가 없는 깨끗한 호스트에서 orbivisord가 apt로 Ceph 꾸러미를
# 받아 mon·mgr을 세우고, 시험이 만든 루프 장치에 OSD를 만들고(시험 끝에 뗀다), RBD 풀을 등록해 VM을 켠다.
# qemu-it와 함께 켜고, Linux(Ubuntu 24.04)에서 root, apt가 닿는 네트워크와 qemu-block-extra가 필요하다. 호스트에
# Ceph 꾸러미와 데몬을 남기므로 CI 러너에서만 돌린다.
ceph-it = []
# 실제 게스트로 설치 매체와 cloud-init을 보는 E2E(계획 57): 설치 ISO(`OPL_TEST_INSTALL_ISO`, Alpine virt)로 BIOS·UEFI VM이
# CD에서 부팅하는지, 클라우드 이미지(`OPL_TEST_CLOUD_IMAGE`, Ubuntu 24.04 qcow2)에 cloud-init이 적용되는지 본다.
# qemu-it와 함께 켜고, KVM이 있는 x86_64 Linux와 ovmf, 인터넷에서 받아 둔 두 파일이 필요하다(CI `install-media` 작업).
install-media-it = []
# 실제 게스트로 템플릿·연결 복제를 보는 E2E(계획 58): 받아 둔 클라우드 이미지(`OPL_TEST_CLOUD_IMAGE`, Ubuntu 24.04 qcow2)를
# 관리자 카탈로그 항목으로 받아 템플릿을 만들고, 연결 복제 둘이 cloud-init으로 켜져 보고하는지, 평탄화한 VM이 다시 켜지는지
# 본다. qemu-it와 함께 켜고, KVM이 있는 x86_64 Linux와 ovmf가 필요하다(CI `install-media` 작업).
templates-it = []
# 실제 swtpm으로 vTPM을 보는 E2E(계획 59): TPM VM의 상태 만들기·해시 기록·초기화(`vtpm.rs`), migration-it와 함께
# 켜면 두 노드 사이 TPM 상태 옮기기·받아 오기(`migration.rs`), ha-it와 함께 켜면 사본 노드로의 HA 복구(`ha.rs`).
# qemu-it의 준비물에 더해 swtpm·swtpm-tools(Linux CI `linux-kvm`)가 필요하다. install-media-it와 함께 켜면 받아 둔
# Ubuntu 클라우드 이미지(`OPL_TEST_CLOUD_IMAGE`)를 TPM·Secure Boot·게스트 에이전트로 켜는 실제 게스트 시험도 돈다
# (KVM이 있는 x86_64 Linux와 Secure Boot 키를 넣은 ovmf, CI `install-media` 작업).
vtpm-it = ["qemu-it"]
# 한 호스트의 opld 둘로 실행 중인 VM을 공유 풀 위에서 옮기고 노드마다 다른 로컬 디렉터리 풀 사이로 디스크를
# 복사하며 옮기는 라이브 마이그레이션 E2E. qemu-it의 준비물과 qemu-img, qemu-io가 필요하다. nfs-it·rbd-it·
# lvm-shared-it와 함께 켜면 그 풀로도 옮기고, lvm-it·zfs-it와 함께 켜면 디렉터리 → 그 블록 풀 → 디렉터리로
# 디스크를 복사하며 왕복한다(그 시험의 준비물).
migration-it = []
# 한 호스트의 opld 둘(프로세스 펜싱)과 위트니스로 죽은 노드의 HA VM을 리더가 다른 노드에서 켜는지 보는
# E2E. qemu-it의 준비물과 qemu-img가 필요하다.
# 제어 소켓의 `POST /v1/test/isolate`·`/v1/test/heal`로 노드 간 통신을 끊고 잇는다(opl-peer `fault-it`).
ha-it = ["opl-peer/fault-it"]
# 시험 빌드에만 있는 굶김 시험 고리: 설정 `[test] block_api_ms`와 제어 소켓의 `POST /v1/test/block-api`
# (`api` 실행기의 작업자를 모두 막음)·`GET /v1/test/raft`(리더·임기·리스 나이). 배포 빌드에는 넣지 않는다.
# opld 셋으로 리더의 `api` 실행기를 막아도 HA 리스와 Raft 리더가 그대로인지 보는 시험(QEMU 없음).
starve-it = []
# 시험 빌드에만 있는 지표 기록·경보 고리(계획 60): 설정 `[test] metrics_flush_secs`·`metrics_push_secs`로 기록·밀어 넘기기
# 주기를, `alert_tick_ms`로 경보 평가 간격과 해제 대기를 줄인다. QEMU 없이 재시작 뒤 기록과 경보 발생·해제를 보는 시험이
# 쓴다(qemu-it에도 같은 고리가 있다).
metrics-it = []
# 실제 QEMU로 CPU 모델·플래그를 보는 E2E(계획 63): 노드 탐침의 카탈로그, 숨긴 플래그가 vCPU에서 꺼졌는지(QMP `qom-get`),
# 실행 중 붙인 vCPU와 마이그레이션 받는 쪽도 같은지, 노드가 못 주는 플래그를 켜면 `enforce`로 켜지 않는지. 제어 소켓에
# 시험 고리(`/v1/test/vm-cpu`·`cpu-mask`·`vcpu-props`)를 더한다. qemu-it의 준비물이 필요하고, x86_64 시험은 KVM이 있는
# Linux(CI `linux-kvm`), 이 Mac(aarch64)은 TCG로 명명 모델과 `sve` 숨기기만 본다.
cpu-it = ["qemu-it"]

