[package]
name = "opld"
description = "opLite node daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# 실제 QEMU로 CLI부터 콘솔, kill -9 뒤 재연결까지 확인하는 E2E 테스트.
# macOS는 brew install qemu, Linux는 apt install qemu-system ovmf qemu-efi-aarch64 qemu-utils가 필요하다.
qemu-it = []
# VM NIC를 Linux 브리지에 잇는 E2E 테스트(qemu-it와 함께). Linux에서 root와 iproute2가 필요하다.
net-it = []
# 웹 UI(web/dist)를 바이너리에 넣는다. 먼저 `pnpm -C web build`로 만든다. 디버그 빌드는 없어도 되고
# 안내 페이지를 준다.
web-ui = []
# 브라우저(Playwright)로 웹 UI를 확인하는 E2E. qemu-it의 준비물에 더해 pnpm과
# `pnpm -C web exec playwright install chromium`, 빌드한 web/dist가 필요하다.
web-it = ["qemu-it", "web-ui"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
openraft.workspace = true
opl-api.workspace = true
opl-cluster.workspace = true
opl-driver.workspace = true
opl-peer.workspace = true
opl-qemu.workspace = true
opl-reconciler.workspace = true
opl-types.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
oplctl.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
