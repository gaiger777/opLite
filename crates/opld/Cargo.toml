[package]
name = "opld"
description = "opLite node daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# 실제 QEMU로 CLI부터 콘솔, kill -9 뒤 재연결까지 확인하는 E2E 테스트.
# macOS는 brew install qemu, Linux는 apt install qemu-system ovmf qemu-efi-aarch64 qemu-utils가 필요하다.
qemu-it = []
# VM NIC를 Linux 브리지에 잇는 E2E 테스트(qemu-it와 함께). Linux에서 root와 iproute2가 필요하다.
net-it = []
# 웹 UI(web/dist)를 바이너리에 넣는다. 먼저 `pnpm -C web build`로 만든다. 디버그 빌드는 없어도 되고
# 안내 페이지를 준다.
web-ui = []
# 실제 NFS 풀을 마운트하는 E2E 테스트. Linux에서 root, NFS 클라이언트(nfs-common), qemu-img와
# 127.0.0.1에 내보낸 디렉터리(`OPL_TEST_NFS_EXPORT`)가 필요하다.
nfs-it = []
# 실제 LVM-thin 풀의 볼륨으로 VM을 띄우는 E2E 테스트. qemu-it의 준비물에 더해 Linux에서 root, lvm2,
# qemu-io와 테스트가 LV를 만들고 지워도 되는 VG/thin pool(`OPL_TEST_LVM=VG/THINPOOL`)이 필요하다.
lvm-it = []
# 실제 ZFS 풀의 볼륨(zvol)으로 VM을 띄우는 E2E 테스트. qemu-it의 준비물에 더해 Linux에서 root,
# zfsutils-linux, qemu-io와 테스트가 zvol을 만들고 지워도 되는 데이터셋(`OPL_TEST_ZFS=POOL/DATASET`)이 필요하다.
zfs-it = []
# 실제 Ceph RBD 풀의 볼륨(RBD 이미지)으로 VM을 띄우는 E2E 테스트. qemu-it의 준비물에 더해 Linux에서 root,
# ceph-common, qemu-block-extra, qemu-io, `client.admin`으로 접속할 수 있는 ceph.conf·키링과 테스트가
# 이미지를 만들고 지워도 되는 Ceph 풀(`OPL_TEST_RBD=POOL`)이 필요하다.
rbd-it = []
# 브라우저(Playwright)로 웹 UI를 확인하는 E2E. qemu-it의 준비물에 더해 pnpm과
# `pnpm -C web exec playwright install chromium`, 빌드한 web/dist가 필요하다.
web-it = ["qemu-it", "web-ui"]

