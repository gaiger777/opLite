[package]
name = "opl-api"
description = "REST API, tasks and authentication for Orbivisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# qemu-img로 볼륨을 만드는 API 테스트 (macOS: brew install qemu, Debian/Ubuntu: apt install qemu-utils)
storage-it = []
# 실제 OpenLDAP(slapd)로 LDAP 영역을 확인하는 테스트. 디렉터리는 .github/scripts/ldap-setup.sh가 만들고
# OPL_TEST_LDAP_* 환경 변수로 알린다.
ldap-it = []

[dependencies]
argon2.workspace = true
async-trait.workspace = true
axum.workspace = true
# OIDC: JWT·JWKS의 base64url
base64.workspace = true
clap.workspace = true
fs4.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
ldap3.workspace = true
libc.workspace = true
opl-cluster.workspace = true
opl-driver.workspace = true
opl-peer.workspace = true
opl-reconciler.workspace = true
opl-types = { workspace = true, features = ["openapi"] }
# OIDC 토큰 교환의 폼 본문
reqwest = { workspace = true, features = ["form"] }
# OIDC: ID 토큰 서명 확인, 상태 쿠키의 HKDF·HMAC, 무작위 값
ring.workspace = true
roxmltree.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
# 감사 로그 읽기의 RFC 3339 시각
time = { workspace = true, features = ["parsing"] }
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true

[dev-dependencies]
# 시험용 가짜 LDAP 서버의 BER
bytes.workspace = true
lber.workspace = true
openraft.workspace = true
opl-qemu.workspace = true
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
