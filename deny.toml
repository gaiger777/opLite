# 공개 코어는 Apache-2.0이다. 호환되지 않는 라이선스의 의존성이 들어오면 CI가 실패한다.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# rust-embed의 폴더 경로 치환(빌드할 때만 쓰는 proc-macro)이 끌어온다. 바이너리에는 들어가지 않는다.
# quoted_printable(0BSD, MIT보다 느슨한 공개 라이선스)은 알림 메일 본문 인코딩에 lettre가 끌어온다(계획 60).
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
    { allow = ["0BSD"], crate = "quoted_printable" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
ignore = [
    # chrono는 openraft 0.9를 거쳐서만 들어온다(직접 쓰지 않는다). 유지보수 중단 권고일 뿐 알려진 취약점은 없고,
    # openraft가 chrono를 떼거나 openraft를 올릴 때 함께 빠진다.
    { id = "RUSTSEC-2026-0543", reason = "openraft 0.9를 거친 간접 의존성, 알려진 취약점 없음" },
]
