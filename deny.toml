# 공개 코어는 Apache-2.0이다. 호환되지 않는 라이선스의 의존성이 들어오면 CI가 실패한다.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# rust-embed의 폴더 경로 치환(빌드할 때만 쓰는 proc-macro)이 끌어온다. 바이너리에는 들어가지 않는다.
exceptions = [{ allow = ["MPL-2.0"], crate = "option-ext" }]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
